<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay code bubble rising dead centre over the Zyn Global dawn, sun straight behind it, no planet -->
<div class="stage" data-out="modern/hero/08-otp-code.jpg" style="height:240px;background:#06080F">
  <svg id="sky" width="600" height="240" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:180px;top:80px;width:240px;height:120px;opacity:.32"></div>
  <div id="dawn" style="left:0;top:90px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/code-bubble.svg" style="left:235px;top:44px;width:130px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2008);
  K.stars(document.getElementById('sky'), { w: 600, h: 240, count: 64, sparkles: 3, avoid: [[300, 108, 86]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 720, sunY: 318, sunR: 170 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
