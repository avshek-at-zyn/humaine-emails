<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
  .wm { font: 900 92px/1 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: .05em; color: transparent;
        -webkit-text-stroke: 1.2px rgba(238,211,246,.22); white-space: nowrap;
        -webkit-mask-image: linear-gradient(180deg, #000 20%, rgba(0,0,0,.25) 100%); }
</style></head>
<body>
<!-- the site's outlined footer wordmark -->
<div class="mark" data-out="modern/marks/wordmark.png" style="width:520px;height:84px">
  <div class="wm" id="wm" style="left:0;top:0">ZYN GLOBAL</div>
</div>
<!-- glowing pink dot for eyebrow pills -->
<div class="mark" data-out="modern/marks/dot.png" style="width:20px;height:20px">
  <div style="left:6.5px;top:6.5px;width:7px;height:7px;border-radius:50%;background:#FA81D6;box-shadow:0 0 8px 1px rgba(250,129,214,.9)"></div>
</div>
<div class="mark" data-out="modern/marks/dot-green.png" style="width:20px;height:20px">
  <div style="left:6.5px;top:6.5px;width:7px;height:7px;border-radius:50%;background:#4ADE80;box-shadow:0 0 8px 1px rgba(74,222,128,.85)"></div>
</div>
<div class="mark" data-out="modern/marks/dot-coral.png" style="width:20px;height:20px">
  <div style="left:6.5px;top:6.5px;width:7px;height:7px;border-radius:50%;background:#FCA5A5;box-shadow:0 0 8px 1px rgba(252,165,165,.85)"></div>
</div>
<div class="mark" data-out="modern/marks/dot-violet.png" style="width:20px;height:20px">
  <div style="left:6.5px;top:6.5px;width:7px;height:7px;border-radius:50%;background:#C4B5FD;box-shadow:0 0 8px 1px rgba(196,181,253,.85)"></div>
</div>
<!-- gradient arrow disc (pill end, finale) -->
<div class="mark" data-out="modern/marks/arrow.png" style="width:30px;height:30px">
  <div style="left:2px;top:2px;width:26px;height:26px;border-radius:50%;background:linear-gradient(90deg,#768AFF,#FA81D6);display:grid;place-items:center;color:#fff;font:700 14px/1 'Helvetica Neue',sans-serif">&rarr;</div>
</div>
<!-- section rule: a hairline that fades at both ends -->
<div class="mark" data-out="modern/marks/rule.png" style="width:520px;height:4px">
  <div style="left:0;top:1.5px;width:520px;height:1px;background:linear-gradient(90deg,rgba(238,211,246,0),rgba(238,211,246,.28) 20%,rgba(238,211,246,.28) 80%,rgba(238,211,246,0))"></div>
</div>
<script src="kit.js"></script>
<script>
  K.init(1);
  // fit the outlined wordmark to the 520px column
  document.fonts.ready.then(() => {
    const wm = document.getElementById('wm'); let size = 92;
    while (wm.getBoundingClientRect().width > 516 && size > 20) { size -= 1; wm.style.fontSize = size + 'px'; }
    const r = wm.getBoundingClientRect(); wm.style.left = ((520 - r.width) / 2) + 'px'; wm.style.top = ((84 - r.height) / 2 + 4) + 'px';
    K.done();
  });
</script>
</body></html>
