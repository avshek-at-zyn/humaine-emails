<!-- the app's own clay lock with the green check (img/src/app/password-reset-success.svg), as a die-cut sticker.
     Inlined below without the loose sparkles and floor shadow, which would otherwise pick up white die-cut edges. -->
<div class="mark" data-out="marks/11-sticker.png" style="width:200px;height:200px">
  <img id="lock" style="left:22px;top:22px;width:154px;transform:rotate(-8deg);filter:url(#diecut)">
</div>
<!-- handwritten aside under the struck-out old password, arrow up at it -->
<div class="mark" data-out="marks/11-note.png" style="width:220px;height:92px">
  <div class="note" style="left:56px;top:22px;transform:rotate(-4deg);font-size:28px;text-align:left">no longer
opens anything</div>
</div>
