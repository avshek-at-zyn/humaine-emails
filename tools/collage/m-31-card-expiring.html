<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay card with its clock, small, rising far right where the sun comes up -->
<div class="stage" data-out="modern/hero/31-card-expiring.jpg" style="height:260px;background:#06080F">
  <svg id="sky" width="600" height="260" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:370px;top:96px;width:210px;height:110px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:110px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/card-clock.svg" style="left:411px;top:68px;width:128px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2031);
  K.stars(document.getElementById('sky'), { w: 600, h: 260, count: 74, sparkles: 3, avoid: [[475, 120, 84]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 1140, sunY: 316, sunR: 170 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
