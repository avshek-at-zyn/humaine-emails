<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay card with its check rising over the Zyn Global dawn, sun low on the left -->
<div class="stage" data-out="modern/hero/27-subscription-confirmed.jpg" style="height:280px;background:#06080F">
  <svg id="sky" width="600" height="280" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:90px;top:100px;width:240px;height:130px;opacity:.38"></div>
  <div id="dawn" style="left:0;top:130px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/card-check.svg" style="left:128px;top:72px;width:160px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2027);
  K.stars(document.getElementById('sky'), { w: 600, h: 280, count: 78, sparkles: 3, avoid: [[208, 140, 100]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 500, sunY: 330, sunR: 200 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
