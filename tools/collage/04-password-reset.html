<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- hero : the clay lock sits inside a hand-drawn clock face; a pink sweep marks the half hour the link lasts -->
<div class="stage" data-out="hero/04-password-reset.jpg" style="height:376px">
  <div class="glow violet" style="left:130px;top:80px;width:290px;height:220px;opacity:.5"></div>
  <div class="glow pink" style="left:430px;top:30px;width:150px;height:130px;opacity:.26"></div>
  <svg id="sky" width="600" height="376" style="left:0;top:0"></svg>
  <div class="planet lilac" style="left:66px;top:252px;width:34px;height:34px"></div>
  <div class="planet blue" style="left:118px;top:58px;width:12px;height:12px"></div>
  <div class="planet pink" style="left:512px;top:278px;width:20px;height:20px"></div>
  <svg id="face" width="600" height="376" style="left:0;top:0"></svg>
  <img class="icon" src="../../img/src/icons/lock-clock.svg" style="left:166px;top:80px;width:204px;transform:rotate(-5deg)">
  <svg id="ink" width="600" height="376" style="left:0;top:0"></svg>
  <div class="note pink" style="left:402px;top:62px;transform:rotate(-7deg);font-size:36px">the clock
 is running</div>
</div>

<script src="kit.js"></script>
<script>
  K.init(404);
  const stage = document.querySelector('.stage');
  K.stars(document.getElementById('sky'), { w: 600, h: 376, count: 66, sparkles: 4, avoid: [[268, 186, 150], [490, 100, 70]] });
  const face = document.getElementById('face');
  const cx = 268, cy = 184, r = 120;
  // the clock face, drawn round twice
  K.ellipse(face, { cx, cy, rx: r, ry: r * 0.95, rot: -4, loops: 1.1, wobble: 0.03, width: 2.4, opacity: .85 });
  // hour ticks, longer at the quarters
  for (let i = 0; i < 12; i++) {
    const a = (-90 + i * 30) * Math.PI / 180, long = i % 3 === 0;
    const r1 = r * (long ? 0.8 : 0.87), r2 = r * 0.95;
    K.line(face, { points: [[cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.95], [cx + Math.cos(a) * r2, cy + Math.sin(a) * r2 * 0.95]], jitter: 0.4, width: long ? 2.6 : 1.8, color: '#B5B7F6', opacity: long ? .9 : .6 });
  }
  // the sweep: twelve round to six, outside the face, ending in an arrowhead
  const ink = document.getElementById('ink');
  const sweep = [];
  for (let k = 0; k <= 18; k++) { const a = (-90 + k * 10) * Math.PI / 180, rr = r + 18 + k * 0.5; sweep.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 0.95]); }
  K.line(ink, { points: sweep, arrow: true, color: '#F9A8D4', width: 3.2, head: 14, jitter: 1.1 });
  // the note points at the sweep
  K.line(ink, { points: [[456, 150], [452, 176], [436, 192], [414, 198]], arrow: true, color: '#F9A8D4', width: 2.6, head: 11 });
  K.doodle(ink, { kind: 'asterisk', x: 92, y: 132, s: 8, color: '#C4B5FD', width: 2 });
  K.doodle(ink, { kind: 'star', x: 520, y: 220, s: 10, color: '#C4B5FD', width: 2 });
  K.ellipse(ink, { cx: 83, cy: 269, rx: 34, ry: 9, rot: -16, loops: 1.1, width: 1.6, opacity: .7, color: '#B5B7F6' });
  K.finish(stage, { top: 0.07, bottom: 0.14, sides: 0.06 });
  K.done();
</script>
</body></html>
