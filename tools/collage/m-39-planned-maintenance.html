<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay gear rising at the far right of the dawn, the big faint planet top-left -->
<div class="stage" data-out="modern/hero/39-planned-maintenance.jpg" style="height:260px;background:#06080F">
  <div class="planet dark" style="left:-60px;top:-96px;width:230px;height:230px;opacity:.5"></div>
  <svg id="sky" width="600" height="260" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:360px;top:100px;width:210px;height:110px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:110px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/gear-clock.svg" style="left:400px;top:62px;width:134px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2039);
  K.stars(document.getElementById('sky'), { w: 600, h: 260, count: 66, sparkles: 2, avoid: [[467, 128, 84], [55, 20, 120]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 1120, sunY: 330, sunR: 170 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
