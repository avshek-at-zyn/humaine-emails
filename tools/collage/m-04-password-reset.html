<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay lock with its clock badge rising on the left of the Zyn Global dawn, a big faint planet top right -->
<div class="stage" data-out="modern/hero/04-password-reset.jpg" style="height:260px;background:#06080F">
  <div class="planet dark" style="left:404px;top:-150px;width:280px;height:280px;opacity:.4"></div>
  <svg id="sky" width="600" height="260" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:20px;top:96px;width:240px;height:120px;opacity:.35"></div>
  <div id="dawn" style="left:0;top:110px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/lock-clock.svg" style="left:62px;top:62px;width:150px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2004);
  K.stars(document.getElementById('sky'), { w: 600, h: 260, count: 70, sparkles: 2, avoid: [[137, 138, 92]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 330, sunY: 338, sunR: 190 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
