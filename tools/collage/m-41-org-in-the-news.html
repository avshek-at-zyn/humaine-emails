<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay newspaper rising at the left of the dawn, a small faint planet far right -->
<div class="stage" data-out="modern/hero/41-org-in-the-news.jpg" style="height:250px;background:#06080F">
  <div class="planet dark" style="left:478px;top:26px;width:92px;height:92px;opacity:.5"></div>
  <svg id="sky" width="600" height="250" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:40px;top:96px;width:200px;height:110px;opacity:.34"></div>
  <div class="glow pink" style="left:150px;top:150px;width:180px;height:60px;opacity:.1"></div>
  <div id="dawn" style="left:0;top:100px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/news-alert.svg" style="left:68px;top:46px;width:142px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2041);
  K.stars(document.getElementById('sky'), { w: 600, h: 250, count: 70, sparkles: 3, avoid: [[139, 117, 90], [524, 72, 60]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 334, sunY: 332, sunR: 180 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
