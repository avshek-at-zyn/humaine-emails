<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- the clay phone with the chat bubble and green check, as a die-cut sticker, a little ping drawn off the badge -->
<div class="mark" data-out="marks/20-sticker.png" style="width:200px;height:200px">
  <img id="icon" data-src="../../img/src/icons/phone-updated.svg" style="left:20px;top:22px;width:150px;transform:rotate(-7deg);filter:url(#diecut)">
</div>

<!-- the stamp beside the number -->
<div class="mark" data-out="marks/20-stamp.png" style="width:200px;height:104px">
  <div class="stamp green" style="left:12px;top:27px;transform:rotate(-8deg);font-size:24px;letter-spacing:4px;padding:9px 12px 8px 16px">Verified</div>
</div>

<!-- pointer up to the digits on the pill -->
<div class="mark" data-out="marks/20-note.png" style="width:320px;height:100px">
  <div class="note" style="left:18px;top:54px;transform:rotate(-3deg);font-size:29px">check the last digits</div>
</div>

<script src="kit.js"></script>
<script>
  function clean(img) {
    return new Promise(res => {
      const x = new XMLHttpRequest();
      x.open('GET', img.getAttribute('data-src'));
      x.onload = () => {
        const s = x.responseText.replace(/<!-- ambient flecks[\s\S]*?(?=\s*<!-- floor shadow)/, '');
        img.onload = img.onerror = () => res();
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      };
      x.onerror = () => { img.onload = img.onerror = () => res(); img.src = img.getAttribute('data-src'); };
      x.send();
    });
  }

  K.init(2020);
  const m = document.querySelectorAll('.mark');
  const st = K.svg(m[0], 200, 200, 'left:0;top:0');
  // ping lines off the green badge
  const c = [128, 122];
  for (const a of [-40, -8, 24]) { const r = a * Math.PI / 180; K.line(st, { points: [[c[0] + Math.cos(r) * 31, c[1] + Math.sin(r) * 31], [c[0] + Math.cos(r) * 43, c[1] + Math.sin(r) * 43]], color: '#4ADE80', width: 2.6, jitter: .3 }); }
  K.doodle(st, { kind: 'asterisk', x: 34, y: 40, s: 7, color: '#F9A8D4', width: 2 });

  K.line(K.svg(m[2], 320, 100), { points: [[236, 52], [242, 33], [220, 15], [182, 8]], arrow: true, color: '#C4B5FD', width: 2.6, head: 11 });

  clean(document.getElementById('icon')).then(() => K.done());
</script>
</body></html>
