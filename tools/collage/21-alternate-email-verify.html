<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
  /* a perforated postage stamp: a hole grid cut in half by the edges, then a solid face over the inside holes */
  .pstamp { width: 90px; height: 110px; background: radial-gradient(circle, transparent 3.6px, #EEE8F6 4.2px) -5px -5px / 10px 10px; filter: drop-shadow(0 12px 14px rgba(0,0,0,.5)); }
  .pstamp > * { position: absolute; }
</style></head>
<body>
<!-- hero : the clay envelope stuck down like a sticker, a dotted trail looping in to it, a postage stamp taped on and franked -->
<div class="stage" data-out="hero/21-alternate-email-verify.jpg" style="height:340px">
  <div class="glow violet" style="left:170px;top:84px;width:290px;height:190px;opacity:.5"></div>
  <div class="glow blue" style="left:40px;top:150px;width:180px;height:130px;opacity:.32"></div>
  <div class="glow pink" style="left:400px;top:40px;width:150px;height:120px;opacity:.24"></div>
  <svg id="sky" width="600" height="340" style="left:0;top:0"></svg>
  <div class="planet blue" style="left:476px;top:236px;width:26px;height:26px"></div>
  <div class="planet pink" style="left:96px;top:70px;width:12px;height:12px"></div>
  <div class="planet cyan" style="left:540px;top:150px;width:8px;height:8px"></div>
  <svg id="trail" width="600" height="340" style="left:0;top:0"></svg>
  <img src="../../img/src/icons/mail-code.svg" style="left:210px;top:84px;width:212px;transform:rotate(-8deg);filter:url(#diecut)">
  <div class="pstamp" style="left:420px;top:70px;transform:rotate(11deg)">
    <div style="left:5px;top:5px;width:80px;height:100px;background:#EEE8F6"></div>
    <div style="left:11px;top:11px;width:68px;height:88px;border:1.5px solid #CBC1E4;background:linear-gradient(165deg,#E4DAF5,#D3C5EE)"></div>
    <div class="planet lilac" style="left:30px;top:32px;width:30px;height:30px"></div>
    <svg id="stampart" width="90" height="110" style="left:0;top:0"></svg>
  </div>
  <div class="tape" style="left:456px;top:58px;width:66px;height:20px;transform:rotate(32deg)"></div>
  <svg id="ink" width="600" height="340" style="left:0;top:0"></svg>
</div>

<!-- the code's own hand-drawn ring (stretched round the code as a td background) -->
<div class="mark" data-out="marks/21-ring.png" style="width:400px;height:150px"></div>

<!-- pointer down to the code -->
<div class="mark" data-out="marks/21-note.png" style="width:320px;height:96px">
  <div class="note" style="left:22px;top:8px;transform:rotate(-3deg);font-size:31px">nobody else needs this</div>
</div>

<script src="kit.js"></script>
<script>
  K.init(2121);
  const stage = document.querySelector('.stage');
  K.stars(document.getElementById('sky'), { w: 600, h: 340, count: 66, sparkles: 4, avoid: [[316, 190, 130]] });

  // dotted trail: comes in from the left, loops once, runs in under the envelope
  const trail = document.getElementById('trail');
  const t = K.line(trail, { points: [[52, 224], [72, 176], [106, 140], [150, 128], [170, 154], [148, 178], [118, 166], [118, 132], [152, 106], [206, 104], [256, 130], [300, 172]], jitter: .9, width: 3.4, color: '#C4B5FD', opacity: .9 });
  t.removeAttribute('filter');
  t.querySelector('path').setAttribute('stroke-dasharray', '0.1 10');

  // stamp art: a ringed planet and two tiny stars
  const sa = document.getElementById('stampart');
  K.ellipse(sa, { cx: 45, cy: 47, rx: 25, ry: 6, rot: -18, loops: 1.08, width: 1.6, color: '#7C6FD6', opacity: .9, passes: 1 });
  K.doodle(sa, { kind: 'asterisk', x: 66, y: 84, s: 4, color: '#9A8BE0', width: 1.4 });
  K.doodle(sa, { kind: 'asterisk', x: 24, y: 80, s: 3, color: '#B79AE0', width: 1.2 });

  // franking: a hand-inked postmark ring over the stamp's corner, wavy cancel lines running off it
  const ink = document.getElementById('ink');
  K.ellipse(ink, { cx: 432, cy: 162, rx: 27, ry: 27, rot: 0, loops: 1.08, wobble: .05, width: 2, color: '#9B8CF0', opacity: .8, passes: 1 });
  for (let i = 0; i < 4; i++) {
    const y = 140 + i * 11;
    K.line(ink, { points: [[466, y], [482, y - 4], [498, y + 1], [514, y - 3], [530, y + 1]], jitter: .5, width: 1.8, color: '#9B8CF0', opacity: .7 });
  }
  K.doodle(ink, { kind: 'star', x: 162, y: 270, s: 9, color: '#F9A8D4', width: 2 });
  K.doodle(ink, { kind: 'asterisk', x: 70, y: 112, s: 6, color: '#C4B5FD', width: 1.8 });
  K.finish(stage, { top: 0.08, bottom: 0.24, sides: 0.06 });

  const m = document.querySelectorAll('.mark');
  K.ellipse(K.svg(m[0], 400, 150), { cx: 200, cy: 76, rx: 182, ry: 57, rot: -3, loops: 1.3, wobble: .045, width: 3.2, color: ['#F9A8D4', '#C4B5FD'] });
  K.line(K.svg(m[1], 320, 96), { points: [[262, 32], [272, 56], [246, 78], [204, 92]], arrow: true, color: '#C4B5FD', width: 2.6, head: 11 });
  K.done();
</script>
</body></html>
