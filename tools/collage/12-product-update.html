<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- hero : the clay rocket at the end of a dotted, looping flight path drawn in marker. An X marks where it took off. -->
<div class="stage" data-out="hero/12-product-update.jpg" style="height:360px">
  <div class="glow violet" style="left:250px;top:60px;width:300px;height:220px;opacity:.5"></div>
  <div class="glow pink" style="left:40px;top:210px;width:240px;height:120px;opacity:.26"></div>
  <div class="glow blue" style="left:120px;top:20px;width:170px;height:120px;opacity:.3"></div>
  <svg id="sky" width="600" height="360" style="left:0;top:0"></svg>
  <div class="planet blue" style="left:178px;top:56px;width:38px;height:38px"></div>
  <div class="planet lilac" style="left:528px;top:70px;width:15px;height:15px"></div>
  <div class="planet cyan" style="left:540px;top:250px;width:10px;height:10px"></div>
  <div class="planet pink" style="left:448px;top:298px;width:9px;height:9px"></div>
  <svg id="trail" width="600" height="360" style="left:0;top:0"></svg>
  <img class="icon" src="../../img/src/icons/rocket.svg" style="left:318px;top:36px;width:226px;transform:rotate(3deg)">
  <svg id="ink" width="600" height="360" style="left:0;top:0"></svg>
</div>

<!-- spiral binding along the top of the notepad page -->
<div class="mark" data-out="marks/12-paper-top.png" data-exact style="width:520px;height:44px"></div>
<!-- bottom of the page, the right corner folded over -->
<div class="mark" data-out="marks/12-paper-bottom.png" data-exact style="width:520px;height:30px"></div>
<!-- ink ring round "Release x.y" (stretched as a td background) -->
<div class="mark" data-out="marks/12-ring.png" style="width:300px;height:72px"></div>
<!-- three hand-drawn circles for the entry numbers -->
<div class="mark" data-out="marks/12-circle-1.png" style="width:72px;height:72px"></div>
<div class="mark" data-out="marks/12-circle-2.png" style="width:72px;height:72px"></div>
<div class="mark" data-out="marks/12-circle-3.png" style="width:72px;height:72px"></div>
<!-- ink note at the foot of the page -->
<div class="mark" data-out="marks/12-note.png" style="width:250px;height:60px">
  <div class="note ink" style="left:14px;top:8px;transform:rotate(-3deg);font-size:28px;color:#4B3F8F">the rest is plumbing</div>
</div>

<script src="kit.js"></script>
<script>
  K.init(1212);
  const stage = document.querySelector('.stage');
  K.stars(document.getElementById('sky'), { w: 600, h: 360, count: 72, sparkles: 5, avoid: [[430, 150, 110], [197, 75, 50]] });

  // the flight path: a dotted marker line with one loop, ending at the exhaust
  const trail = document.getElementById('trail');
  const fly = K.line(trail, {
    points: [[78, 300], [124, 292], [170, 270], [206, 240], [222, 204], [210, 174], [182, 166], [160, 184], [164, 214], [192, 236], [240, 250], [298, 252], [346, 246], [384, 236]],
    color: ['#B5B7F6', '#F9A8D4'], width: 3.2, jitter: 1.2
  });
  fly.querySelector('path').setAttribute('stroke-dasharray', '0.5 10');
  // X marks the take-off
  K.doodle(trail, { kind: 'cross', x: 66, y: 304, s: 8, color: '#F9A8D4', width: 2.6 });

  const ink = document.getElementById('ink');
  // hand-drawn ring round the blue planet
  K.ellipse(ink, { cx: 197, cy: 75, rx: 44, ry: 10.5, rot: -14, loops: 1.12, width: 1.7, opacity: .75, color: '#B5B7F6' });
  // speed strokes beside the rocket
  K.line(ink, { points: [[322, 190], [304, 210]], color: '#C4B5FD', width: 2.2, jitter: .5 });
  K.line(ink, { points: [[340, 214], [318, 240]], color: '#C4B5FD', width: 2.2, jitter: .5 });
  K.line(ink, { points: [[366, 250], [352, 268]], color: '#C4B5FD', width: 2, jitter: .5 });
  K.doodle(ink, { kind: 'star', x: 94, y: 176, s: 11, color: '#F9A8D4', width: 2.2 });
  K.doodle(ink, { kind: 'asterisk', x: 560, y: 160, s: 7, color: '#C4B5FD', width: 2 });
  K.finish(stage, { top: 0.08, bottom: 0.2, sides: 0.06 });

  const m = [...document.querySelectorAll('.mark')];

  // spiral binding: paper from y=18, punched holes, wire coils looping over the top edge
  const ptop = K.svg(m[0], 520, 44);
  const NS = 'http://www.w3.org/2000/svg';
  const add = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); ptop.appendChild(n); return n; };
  add('rect', { x: 0, y: 18, width: 520, height: 26, fill: '#EEE8F6' });
  for (let x = 22; x <= 500; x += 26) {
    add('ellipse', { cx: x, cy: 30, rx: 3.8, ry: 4.2, fill: '#1B1730' });
  }
  for (let x = 22; x <= 500; x += 26) {
    const j = (Math.sin(x * 0.37) * 0.8);
    add('path', { d: `M${x - 1},30 C${x - 5},16 ${x - 3 + j},3 ${x + 4},3 C${x + 10},3 ${x + 9.5},11 ${x + 8},18`, fill: 'none', stroke: '#8E86B8', 'stroke-width': 3.2, 'stroke-linecap': 'round' });
    add('path', { d: `M${x - 1.8},26 C${x - 3.5},16 ${x - 2.2 + j},6 ${x + 3},5`, fill: 'none', stroke: '#E4DFF6', 'stroke-width': 1.1, 'stroke-linecap': 'round', opacity: .9 });
  }

  // folded corner at the bottom right
  const bot = K.svg(m[1], 520, 30);
  const s = 26, h = 26;
  const NB = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); bot.appendChild(n); return n; };
  NB('path', { d: `M0,0 H520 V${h - s} L${520 - s},${h} H0 Z`, fill: '#EEE8F6' });
  NB('path', { d: `M${520 - s},${h} L${520 - s + 4},${h - s + 6} L${520 - 2},${h - s + 1} Z`, fill: 'rgba(43,35,80,.18)' });
  NB('path', { d: `M${520 - s},${h} L520,${h - s} L${520 - s},${h - s} Z`, fill: '#D6CCEA' });
  NB('path', { d: `M${520 - s},${h} L520,${h - s}`, stroke: '#C2B6DD', 'stroke-width': 1 });

  // ink ring
  K.ellipse(K.svg(m[2], 300, 72), { cx: 150, cy: 36, rx: 138, ry: 27, rot: -2, loops: 1.2, wobble: .03, width: 2.6, color: ['#5B62B4', '#D9468F'] });
  // number circles
  for (let i = 3; i <= 5; i++) K.ellipse(K.svg(m[i], 72, 72), { cx: 36, cy: 36, rx: 26, ry: 24, rot: -10 + i * 6, loops: 1.18, wobble: .05, width: 2.4, color: '#7C6FD6' });
  // little underline flick under the note
  K.swash(K.svg(m[6], 250, 60), { x: 20, y: 50, w: 180, h: 4, curve: 1.5, tilt: -1.4, color: '#7C6FD6', opacity: .65, hook: false });
  K.done();
</script>
</body></html>
