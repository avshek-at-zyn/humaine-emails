<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay house rising dead centre, sun straight behind it, the faint dark planet top left -->
<div class="stage" data-out="modern/hero/23-address-updated.jpg" style="height:290px;background:#06080F">
  <div class="planet dark" style="left:-64px;top:-84px;width:214px;height:214px;opacity:.5"></div>
  <svg id="sky" width="600" height="290" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:180px;top:120px;width:240px;height:120px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:140px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/home-updated.svg" style="left:218px;top:56px;width:164px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2323);
  K.stars(document.getElementById('sky'), { w: 600, h: 290, count: 70, sparkles: 2, avoid: [[300, 140, 96], [43, 23, 110]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 720, sunY: 320, sunR: 200 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
