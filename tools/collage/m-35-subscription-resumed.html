<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay calendar (renew arrows) rising over the Zyn Global dawn, sun low on the left, no planet -->
<div class="stage" data-out="modern/hero/35-subscription-resumed.jpg" style="height:260px;background:#06080F">
  <svg id="sky" width="600" height="260" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:50px;top:96px;width:260px;height:120px;opacity:.32"></div>
  <div class="glow blue" style="left:380px;top:40px;width:200px;height:110px;opacity:.12"></div>
  <div id="dawn" style="left:0;top:110px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/calendar-resume.svg" style="left:108px;top:76px;width:144px">
</div>
<script src="kit.js"></script>
<script>
  K.init(3535);
  K.stars(document.getElementById('sky'), { w: 600, h: 260, count: 78, sparkles: 3, avoid: [[180, 146, 92]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 480, sunY: 326, sunR: 205 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
