<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay rocket lifting off the Zyn Global dawn, sun centred-left, no planet -->
<div class="stage" data-out="modern/hero/12-product-update.jpg" style="height:290px;background:#06080F">
  <svg id="sky" width="600" height="290" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:120px;top:120px;width:240px;height:130px;opacity:.34"></div>
  <div class="glow blue" style="left:300px;top:150px;width:220px;height:90px;opacity:.12"></div>
  <div id="dawn" style="left:0;top:140px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/rocket.svg" style="left:158px;top:58px;width:166px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2012);
  K.stars(document.getElementById('sky'), { w: 600, h: 290, count: 80, sparkles: 3, avoid: [[241, 140, 100]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 580, sunY: 334, sunR: 200 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
