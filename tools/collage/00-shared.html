<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- marker underline, stretched under a headline phrase (span background) -->
<div class="mark" data-out="marks/swash.png" style="width:300px;height:24px"></div>
<!-- hand-drawn ring, stretched round a value (td background, background-size:100% 100%) -->
<div class="mark" data-out="marks/ring.png" style="width:300px;height:64px"></div>
<!-- wobbly section rule (520 wide) -->
<div class="mark" data-out="marks/divider.png" style="width:520px;height:14px"></div>
<!-- scribbled strike-through, stretched over an old value (td background) -->
<div class="mark" data-out="marks/strike.png" style="width:300px;height:40px"></div>
<!-- hand-drawn arrows -->
<div class="mark" data-out="marks/arrow-right.png" style="width:84px;height:40px"></div>
<div class="mark" data-out="marks/arrow-down.png" style="width:40px;height:72px"></div>
<!-- hand-drawn check (green) and cross (coral) -->
<div class="mark" data-out="marks/check.png" style="width:44px;height:40px"></div>
<div class="mark" data-out="marks/cross.png" style="width:40px;height:40px"></div>
<!-- timeline dots: done / now / next -->
<div class="mark" data-out="marks/dot-done.png" style="width:28px;height:28px"></div>
<div class="mark" data-out="marks/dot-now.png" style="width:28px;height:28px"></div>
<div class="mark" data-out="marks/dot-next.png" style="width:28px;height:28px"></div>
<!-- paper card edges (520 wide, paper #EEE8F6): torn top, taped torn top, receipt teeth, torn bottom, ticket perforation -->
<div class="mark" data-out="marks/paper-top.png" data-exact style="width:520px;height:22px"></div>
<div class="mark" data-out="marks/paper-top-taped.png" data-exact style="width:520px;height:46px">
  <div class="tape" style="left:200px;top:6px;width:120px;height:28px;transform:rotate(-3deg)"></div>
</div>
<div class="mark" data-out="marks/paper-teeth.png" data-exact style="width:520px;height:16px"></div>
<div class="mark" data-out="marks/paper-bottom.png" data-exact style="width:520px;height:22px"></div>
<div class="mark" data-out="marks/paper-perf.png" data-exact style="width:520px;height:28px"></div>
<script src="kit.js"></script>
<script>
  K.init(7);
  const m = [...document.querySelectorAll('.mark')];
  K.swash(K.svg(m[0], 300, 24), { x: 6, y: 12, w: 284, h: 8, curve: 2.5, tilt: -0.6, hook: false });
  K.ellipse(K.svg(m[1], 300, 64), { cx: 150, cy: 32, rx: 141, ry: 25, rot: -1.5, loops: 1.22, wobble: 0.03, width: 2.4, color: ['#F9A8D4', '#C4B5FD'] });
  K.line(K.svg(m[2], 520, 14), { points: [[4, 8], [180, 6], [360, 8.5], [516, 6]], jitter: 1.1, width: 1.6, color: '#34364A' });
  const st = K.svg(m[3], 300, 40);
  K.line(st, { points: [[6, 24], [100, 20], [200, 22], [294, 15]], jitter: 1.4, width: 3, color: '#F9A8D4' });
  K.line(st, { points: [[14, 18], [150, 25], [286, 20]], jitter: 1.2, width: 2, color: '#F9A8D4', opacity: .7 });
  K.line(K.svg(m[4], 84, 40), { points: [[6, 24], [30, 18], [58, 20], [76, 18]], arrow: true, color: '#C4B5FD', width: 2.6, head: 11 });
  K.line(K.svg(m[5], 40, 72), { points: [[18, 4], [23, 26], [19, 48], [21, 66]], arrow: true, color: '#C4B5FD', width: 2.6, head: 11 });
  K.doodle(K.svg(m[6], 44, 40), { kind: 'check', x: 22, y: 20, s: 14, color: '#4ADE80', width: 3 });
  K.doodle(K.svg(m[7], 40, 40), { kind: 'cross', x: 20, y: 20, s: 11, color: '#FCA5A5', width: 3 });
  const d1 = K.svg(m[8], 28, 28); K.ellipse(d1, { cx: 14, cy: 14, rx: 6, ry: 6, loops: 3.2, wobble: .08, width: 4.2, color: '#C48DD8', passes: 1 });
  const d2 = K.svg(m[9], 28, 28); K.ellipse(d2, { cx: 14, cy: 14, rx: 10.5, ry: 10.5, loops: 1.15, wobble: .05, width: 2.2, color: '#F9A8D4' }); K.ellipse(d2, { cx: 14, cy: 14, rx: 4, ry: 4, loops: 3, wobble: .08, width: 3.6, color: '#F2F0FA', passes: 1 });
  K.ellipse(K.svg(m[10], 28, 28), { cx: 14, cy: 14, rx: 7, ry: 7, loops: 1.1, wobble: .06, width: 1.8, color: '#565869' });
  K.tornTop(K.svg(m[11], 520, 22), { w: 520, h: 22, y: 9 });
  const tt = K.svg(m[12], 520, 46); m[12].insertBefore(tt, m[12].firstChild); K.tornTop(tt, { w: 520, h: 46, y: 28 });
  K.teeth(K.svg(m[13], 520, 16), { w: 520, h: 16, size: 10 });
  K.tornBottom(K.svg(m[14], 520, 22), { w: 520, h: 22, y: 12 });
  K.perforation(K.svg(m[15], 520, 28), { w: 520, h: 28 });
  K.done();
</script>
</body></html>
