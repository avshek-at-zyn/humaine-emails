<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay authenticator rising over the Zyn Global dawn, sun low on the left, planet top right -->
<div class="stage" data-out="modern/hero/06-mfa-change.jpg" style="height:270px;background:#06080F">
  <div class="planet dark" style="left:418px;top:-118px;width:250px;height:250px;opacity:.42"></div>
  <svg id="sky" width="600" height="270" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:60px;top:110px;width:220px;height:110px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:120px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/authenticator-reset.svg" style="left:96px;top:58px;width:148px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2006);
  K.stars(document.getElementById('sky'), { w: 600, h: 270, count: 74, sparkles: 2, avoid: [[170, 132, 92]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 410, sunY: 326, sunR: 180 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
