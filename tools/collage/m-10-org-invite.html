<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay invitation envelope rising over the Zyn Global dawn, the sun left of centre, a faint dark planet top right -->
<div class="stage" data-out="modern/hero/10-org-invite.jpg" style="height:270px;background:#06080F">
  <div class="planet dark" style="left:392px;top:-96px;width:230px;height:230px;opacity:.5"></div>
  <svg id="sky" width="600" height="270" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:90px;top:100px;width:250px;height:120px;opacity:.36"></div>
  <div id="dawn" style="left:0;top:120px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/app/invitation-mail-sent.svg" style="left:132px;top:52px;width:154px">
</div>
<script src="kit.js"></script>
<script>
  K.init(1010);
  K.stars(document.getElementById('sky'), { w: 600, h: 270, count: 74, sparkles: 3, avoid: [[209, 128, 100]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 520, sunY: 332, sunR: 190 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
