<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay refund receipt rising dead centre over the dawn, the big faint planet top left -->
<div class="stage" data-out="modern/hero/37-refund-issued.jpg" style="height:270px;background:#06080F">
  <div class="planet dark" style="left:-70px;top:-120px;width:270px;height:270px;opacity:.5"></div>
  <svg id="sky" width="600" height="270" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:180px;top:104px;width:240px;height:124px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:120px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/receipt-refund.svg" style="left:222px;top:70px;width:156px">
</div>
<script src="kit.js"></script>
<script>
  K.init(3737);
  K.stars(document.getElementById('sky'), { w: 600, h: 270, count: 74, sparkles: 2, avoid: [[300, 148, 100], [65, 15, 140]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 770, sunY: 322, sunR: 205 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
