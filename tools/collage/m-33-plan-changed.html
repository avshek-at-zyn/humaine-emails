<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay card with its swap badge rising far left, a big faint dark planet top right -->
<div class="stage" data-out="modern/hero/33-plan-changed.jpg" style="height:290px;background:#06080F">
  <div class="planet dark" style="left:410px;top:-110px;width:260px;height:260px;opacity:.5"></div>
  <svg id="sky" width="600" height="290" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:24px;top:116px;width:230px;height:120px;opacity:.36"></div>
  <div id="dawn" style="left:0;top:140px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/card-swap.svg" style="left:62px;top:86px;width:150px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2033);
  K.stars(document.getElementById('sky'), { w: 600, h: 290, count: 72, sparkles: 2, avoid: [[137, 145, 96]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 330, sunY: 326, sunR: 190 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
