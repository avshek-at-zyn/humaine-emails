<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay member with the alert badge rising dead centre, no planet, a wide sun -->
<div class="stage" data-out="modern/hero/17-recovery-admin-alert.jpg" style="height:250px;background:#06080F">
  <svg id="sky" width="600" height="250" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:190px;top:96px;width:220px;height:110px;opacity:.3"></div>
  <div class="glow pink" style="left:250px;top:130px;width:120px;height:70px;opacity:.16"></div>
  <div id="dawn" style="left:0;top:100px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/admin-alert.svg" style="left:232px;top:44px;width:136px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2017);
  K.stars(document.getElementById('sky'), { w: 600, h: 250, count: 78, sparkles: 3, avoid: [[300, 112, 90]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 720, sunY: 322, sunR: 210 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
