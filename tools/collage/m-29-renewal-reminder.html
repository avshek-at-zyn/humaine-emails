<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay calendar rising dead centre over the dawn, a faint dark planet top left -->
<div class="stage" data-out="modern/hero/29-renewal-reminder.jpg" style="height:270px;background:#06080F">
  <div class="planet dark" style="left:-60px;top:-80px;width:210px;height:210px;opacity:.5"></div>
  <svg id="sky" width="600" height="270" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:190px;top:100px;width:220px;height:120px;opacity:.34"></div>
  <div id="dawn" style="left:0;top:120px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/calendar-clock.svg" style="left:230px;top:52px;width:140px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2029);
  K.stars(document.getElementById('sky'), { w: 600, h: 270, count: 70, sparkles: 2, avoid: [[300, 125, 92]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 720, sunY: 320, sunR: 180 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
