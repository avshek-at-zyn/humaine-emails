<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
  /* an instant photo of the member, taped down, captioned by hand */
  .polaroid { background: #F2EEF8; box-shadow: 0 18px 34px rgba(0,0,0,.55); }
  .polaroid > * { position: absolute; }
  .photo { overflow: hidden; background: radial-gradient(circle at 42% 34%, #3B3170, #1B1834 72%); box-shadow: inset 0 0 0 1px rgba(27,23,48,.25); }
  .photo > * { position: absolute; }
</style></head>
<body>
<!-- hero : the member as a polaroid, the alert badge ringed by hand, "is it really them?" on the caption strip -->
<div class="stage" data-out="hero/17-recovery-admin-alert.jpg" style="height:370px">
  <div class="glow violet" style="left:170px;top:70px;width:280px;height:230px;opacity:.5"></div>
  <div class="glow pink" style="left:396px;top:170px;width:170px;height:140px;opacity:.3"></div>
  <svg id="sky" width="600" height="370" style="left:0;top:0"></svg>
  <div class="planet lilac" style="left:88px;top:232px;width:30px;height:30px"></div>
  <div class="planet pink" style="left:476px;top:74px;width:18px;height:18px"></div>
  <div class="planet cyan" style="left:524px;top:268px;width:10px;height:10px"></div>
  <svg id="back" width="600" height="370" style="left:0;top:0"></svg>
  <div class="polaroid" style="left:190px;top:42px;width:224px;height:264px;transform:rotate(-4deg)">
    <div class="photo" style="left:14px;top:14px;width:196px;height:186px">
      <img id="who" data-src="../../img/src/icons/admin-alert.svg" style="left:-6px;top:8px;width:206px">
      <i id="badge" style="left:155px;top:147px;width:0;height:0"></i>
    </div>
    <div class="note ink" style="left:20px;top:212px;font-size:31px;color:#4B3F8F;transform:rotate(-2deg)">is it really them?</div>
  </div>
  <div class="tape" style="left:256px;top:26px;width:104px;height:28px;transform:rotate(4deg)"></div>
  <svg id="ink" width="600" height="370" style="left:0;top:0"></svg>
</div>

<!-- an empty hand-drawn checkbox, in ink, for the paper checklist -->
<div class="mark" data-out="marks/17-box.png" style="width:40px;height:40px"></div>

<!-- notepad page: torn top with the punched holes left from the spiral -->
<div class="mark" data-out="marks/17-paper-top.png" data-exact style="width:520px;height:34px"></div>

<!-- pointer down to the button -->
<div class="mark" data-out="marks/17-note.png" style="width:360px;height:92px">
  <div class="note" style="left:34px;top:6px;transform:rotate(-3deg);font-size:29px">only after all three</div>
</div>

<script src="kit.js"></script>
<script>
  // strip an icon's ambient flecks (and keep everything else) before it goes in the photo
  function clean(img) {
    return new Promise(res => {
      const x = new XMLHttpRequest();
      x.open('GET', img.getAttribute('data-src'));
      x.onload = () => {
        const s = x.responseText.replace(/<!-- ambient flecks[\s\S]*?(?=\s*<!-- floor shadow)/, '');
        img.onload = img.onerror = () => res();
        img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
      };
      x.onerror = () => { img.onload = img.onerror = () => res(); img.src = img.getAttribute('data-src'); };
      x.send();
    });
  }

  K.init(1717);
  const stage = document.querySelector('.stage');
  K.stars(document.getElementById('sky'), { w: 600, h: 370, count: 68, sparkles: 5, avoid: [[302, 182, 150]] });
  const back = document.getElementById('back');
  K.ellipse(back, { cx: 485, cy: 83, rx: 34, ry: 9, rot: -14, loops: 1.1, width: 1.6, opacity: .7, color: '#B5B7F6' });

  clean(document.getElementById('who')).then(() => {
    const ink = document.getElementById('ink');
    // ring the alert badge by hand, wherever the tilted photo put it
    const sr = stage.getBoundingClientRect(), b = document.getElementById('badge').getBoundingClientRect();
    const bx = b.left - sr.left, by = b.top - sr.top;
    K.ellipse(ink, { cx: bx, cy: by, rx: 34, ry: 30, rot: -10, loops: 1.25, width: 2.6, color: ['#FCA5A5', '#F9A8D4'], opacity: .95 });
    // a question mark, scribbled beside the photo
    K.line(ink, { points: [[452, 168], [458, 150], [476, 142], [492, 150], [492, 166], [478, 178], [474, 194]], color: '#FCA5A5', width: 2.8, jitter: .7 });
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    dot.setAttribute('cx', 474); dot.setAttribute('cy', 208); dot.setAttribute('r', 3); dot.setAttribute('fill', '#FCA5A5'); dot.setAttribute('filter', 'url(#marker)');
    ink.appendChild(dot);
    K.doodle(ink, { kind: 'asterisk', x: 124, y: 112, s: 8, color: '#C4B5FD', width: 2 });
    K.line(ink, { points: [[100, 300], [126, 306], [152, 300]], color: '#C4B5FD', width: 2, jitter: .8 });
    K.finish(stage, { top: 0.08, bottom: 0.16, sides: 0.06 });

    const m = document.querySelectorAll('.mark');
    // checkbox: a wobbly square drawn in one go, corners overshooting a little
    K.line(K.svg(m[0], 40, 40), { points: [[9, 8], [31, 7], [32, 30], [9, 32], [8.5, 10], [12, 7]], color: '#4B3F8F', width: 2.4, jitter: .6 });
    // torn top with spiral holes
    const top = K.svg(m[1], 520, 34);
    K.tornTop(top, { w: 520, h: 34, y: 10 });
    const NS = 'http://www.w3.org/2000/svg';
    const mask = document.createElementNS(NS, 'mask'); mask.setAttribute('id', 'holes');
    mask.innerHTML = '<rect width="520" height="34" fill="#fff"/>' + [...Array(13)].map((_, i) => `<circle cx="${32 + i * 38}" cy="23" r="4.5" fill="#000"/>`).join('');
    top.querySelector('defs').appendChild(mask);
    top.querySelector('path').setAttribute('mask', 'url(#holes)');
    // note pointer
    K.line(K.svg(m[2], 360, 92), { points: [[262, 34], [270, 54], [246, 72], [204, 86]], arrow: true, color: '#C4B5FD', width: 2.6, head: 11 });
    K.done();
  });
</script>
</body></html>
