<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"></head>
<body>
<!-- Modern hero: the clay keypad with its green check rising far right over the Zyn Global dawn, a big faint planet top left -->
<div class="stage" data-out="modern/hero/14-pin-changed.jpg" style="height:280px;background:#06080F">
  <div class="planet dark" style="left:-80px;top:-70px;width:250px;height:250px;opacity:.5"></div>
  <svg id="sky" width="600" height="280" style="left:0;top:0"></svg>
  <div class="glow violet" style="left:347px;top:116px;width:240px;height:120px;opacity:.35"></div>
  <div id="dawn" style="left:0;top:130px;width:600px;height:150px"></div>
  <img class="icon" src="../../img/src/icons/keypad-check.svg" style="left:387px;top:60px;width:160px">
</div>
<script src="kit.js"></script>
<script>
  K.init(2014);
  K.stars(document.getElementById('sky'), { w: 600, h: 280, count: 72, sparkles: 2, avoid: [[467, 140, 96]] });
  K.dawn(document.getElementById('dawn'), { w: 600, h: 150, sunX: 1120, sunY: 352, sunR: 200 });
  K.finish(document.querySelector('.stage'), { grain: 0.12, top: 0.06, bottom: 0.02, sides: 0.04, canvas: '#06080F' });
  K.done();
</script>
</body></html>
