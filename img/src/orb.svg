<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#5271FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F5F0FA"/>
      <stop offset="22%" stop-color="#B5B7F6"/>
      <stop offset="60%" stop-color="#5271FF"/>
      <stop offset="100%" stop-color="#2E3FB8"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C3F0"/>
      <stop offset="50%" stop-color="#B5B7F6"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blurS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="900" height="900" fill="#180A24"/>
  <circle cx="450" cy="440" r="430" fill="url(#halo)"/>

  <!-- orbit ring behind -->
  <ellipse cx="450" cy="460" rx="330" ry="120" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.5" transform="rotate(-18 450 460)"/>

  <!-- orb -->
  <circle cx="450" cy="440" r="185" fill="url(#core)" filter="url(#blurS)"/>
  <circle cx="450" cy="440" r="185" fill="none" stroke="#E5C3F0" stroke-opacity="0.35" stroke-width="1.5"/>
  <!-- specular highlight -->
  <ellipse cx="392" cy="368" rx="70" ry="44" fill="#F5F0FA" opacity="0.5" filter="url(#blurL)"/>

  <!-- orbit ring front arc -->
  <path d="M 140 560 A 330 120 -18 0 0 762 356" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.9" filter="url(#blurS)"/>
  <circle cx="762" cy="356" r="7" fill="#E5C3F0" filter="url(#blurS)"/>

  <!-- stars -->
  <circle cx="150" cy="160" r="2.6" fill="#E5C3F0" opacity="0.8"/>
  <circle cx="760" cy="140" r="2" fill="#B5B7F6" opacity="0.6"/>
  <circle cx="240" cy="740" r="2.2" fill="#B5B7F6" opacity="0.55"/>
  <circle cx="700" cy="720" r="1.6" fill="#E5C3F0" opacity="0.5"/>
  <circle cx="90" cy="430" r="1.5" fill="#5271FF" opacity="0.7"/>
  <circle cx="820" cy="520" r="1.8" fill="#5271FF" opacity="0.6"/>
</svg>
