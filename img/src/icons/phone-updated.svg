<svg width="232" height="235" viewBox="0 0 232 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- humAIne clay icon: recovery phone updated. The lilac clay phone from device-alert.svg, a violet chat bubble on its dark glassy
       screen (codes arrive by message), and the glossy green success badge from password-reset-success.svg. -->

  <!-- ambient flecks (same vocabulary as password-reset-success.svg) -->
  <g opacity="0.3">
    <path d="M190 18V32" stroke="#FFE9B3" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M22 58L31 67" stroke="#FFE9B3" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M214 68L205 77" stroke="#FFE9B3" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g opacity="0.6" filter="url(#puBlurS)"><circle cx="34" cy="38" r="1.8" fill="white"/></g>
  <g opacity="0.35" filter="url(#puBlurM)"><circle cx="182" cy="46" r="7" fill="white"/></g>
  <rect x="196" y="110" width="7" height="7" rx="1.8" transform="rotate(-20 199.5 113.5)" fill="#7DE8FF"/>
  <rect x="18" y="146" width="6.5" height="6.5" rx="1.6" transform="rotate(25 21.25 149.25)" fill="#8B7FFF"/>
  <circle cx="206" cy="206" r="3.4" fill="#FF9AC4"/>
  <rect x="28" y="202" width="6" height="6" rx="1.5" transform="rotate(-14 31 205)" fill="#FFD166"/>

  <!-- floor shadow -->
  <g opacity="0.32" filter="url(#puFloor)">
    <ellipse cx="112" cy="212" rx="60" ry="9" fill="black"/>
  </g>

  <!-- side keys (sit behind the body) -->
  <rect x="43" y="68" width="9" height="24" rx="4.5" fill="url(#puKey)"/>
  <rect x="43" y="98" width="9" height="16" rx="4.5" fill="url(#puKey)"/>
  <rect x="160" y="74" width="9" height="30" rx="4.5" fill="url(#puKey)"/>

  <!-- phone body : base / bottom shade / specular -->
  <rect x="48" y="28" width="116" height="166" rx="30" fill="url(#puBody0)"/>
  <rect x="48" y="28" width="116" height="166" rx="30" fill="url(#puBody1)"/>
  <rect x="48" y="28" width="116" height="166" rx="30" fill="url(#puBody2)"/>

  <!-- screen : soft recess, dark glass, violet glow, sheen -->
  <g opacity="0.55" filter="url(#puRecess)">
    <rect x="60" y="40.5" width="92" height="142" rx="20" fill="#5E2F78"/>
  </g>
  <rect x="62" y="42" width="88" height="138" rx="18" fill="url(#puScr0)"/>
  <rect x="62" y="42" width="88" height="138" rx="18" fill="url(#puScrGlow)"/>
  <rect x="62" y="42" width="88" height="138" rx="18" fill="url(#puScrTop)"/>
  <g clip-path="url(#puScrClip)">
    <path d="M62 42H128L62 130Z" fill="url(#puSheen)"/>
  </g>
  <rect x="94" y="50" width="24" height="7" rx="3.5" fill="#0A0718" fill-opacity="0.9"/>

  <!-- on-screen chat bubble : violet clay, three white clay dots -->
  <circle cx="106" cy="100" r="44" fill="url(#puHalo)"/>
  <g opacity="0.5" filter="url(#puBubbleSh)">
    <path d="M95 80H117A15 15 0 0 1 132 95V103A15 15 0 0 1 117 118H101C97 123.5 91 127.5 84 129C86.5 124.5 86.6 118 84.4 113.6A15 15 0 0 1 80 103V95A15 15 0 0 1 95 80Z" fill="#0A0718"/>
  </g>
  <path d="M95 76H117A15 15 0 0 1 132 91V99A15 15 0 0 1 117 114H101C97 119.5 91 123.5 84 125C86.5 120.5 86.6 114 84.4 109.6A15 15 0 0 1 80 99V91A15 15 0 0 1 95 76Z" fill="url(#puBub0)"/>
  <path d="M95 76H117A15 15 0 0 1 132 91V99A15 15 0 0 1 117 114H101C97 119.5 91 123.5 84 125C86.5 120.5 86.6 114 84.4 109.6A15 15 0 0 1 80 99V91A15 15 0 0 1 95 76Z" fill="url(#puBub1)"/>
  <path d="M95 76H117A15 15 0 0 1 132 91V99A15 15 0 0 1 117 114H101C97 119.5 91 123.5 84 125C86.5 120.5 86.6 114 84.4 109.6A15 15 0 0 1 80 99V91A15 15 0 0 1 95 76Z" fill="url(#puBub2)"/>
  <g fill="url(#puDot)">
    <circle cx="94" cy="95" r="4"/>
    <circle cx="106" cy="95" r="4"/>
    <circle cx="118" cy="95" r="4"/>
  </g>
  <rect x="84" y="142" width="44" height="7" rx="3.5" fill="#B5B7F6" fill-opacity="0.42"/>
  <rect x="90" y="155" width="32" height="7" rx="3.5" fill="#B5B7F6" fill-opacity="0.22"/>

  <!-- badge : glossy green success disc + white check (from password-reset-success.svg), centred on the lower-right bezel -->
  <g opacity="0.42" filter="url(#puBadgeSh)">
    <circle cx="163.5" cy="166.5" r="21.5" fill="#2A0F3E"/>
  </g>
  <circle cx="162" cy="162" r="22" fill="url(#puOk0)"/>
  <circle cx="162" cy="162" r="22" fill="url(#puOk1)"/>
  <path d="M152.9 162.2L159.6 169.8L172 154.6" stroke="url(#puTick)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <filter id="puFloor" x="40" y="190" width="150" height="44" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="puRecess" x="52" y="32" width="108" height="158" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="puBubbleSh" x="72" y="72" width="68" height="66" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="puBadgeSh" x="132" y="135" width="63" height="63" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="puBlurS" x="28" y="32" width="12" height="12" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="puBlurM" x="168" y="32" width="28" height="28" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <clipPath id="puScrClip"><rect x="62" y="42" width="88" height="138" rx="18"/></clipPath>

    <linearGradient id="puKey" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D4A2E6"/><stop offset="1" stop-color="#7A3E96"/>
    </linearGradient>

    <!-- body: lilac clay, lit top-left -->
    <radialGradient id="puBody0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(94.4 58) scale(90 126)">
      <stop stop-color="#F0D6F8"/><stop offset="0.3" stop-color="#E5C3F0"/><stop offset="0.7" stop-color="#C48DD8"/><stop offset="1" stop-color="#8E56A8"/>
    </radialGradient>
    <radialGradient id="puBody1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(111.8 172.4) scale(67 96)">
      <stop stop-opacity="0"/><stop offset="0.65" stop-opacity="0"/><stop offset="1" stop-color="#472858" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="puBody2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(70 44) scale(38 34)">
      <stop stop-color="white" stop-opacity="0.55"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- screen: dark glass -->
    <linearGradient id="puScr0" x1="62" y1="42" x2="150" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3A2E6B"/><stop offset="0.45" stop-color="#211A46"/><stop offset="1" stop-color="#130E2B"/>
    </linearGradient>
    <radialGradient id="puScrGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(106 108) scale(64 72)">
      <stop stop-color="#9B8CF5" stop-opacity="0.6"/><stop offset="0.5" stop-color="#7A6AE0" stop-opacity="0.24"/><stop offset="1" stop-color="#7A6AE0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="puScrTop" x1="0" y1="42" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0716" stop-opacity="0.55"/><stop offset="0.12" stop-color="#0A0716" stop-opacity="0"/>
      <stop offset="0.86" stop-color="#0A0716" stop-opacity="0"/><stop offset="1" stop-color="#0A0716" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="puSheen" x1="62" y1="42" x2="104.2" y2="73.7" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0.18"/><stop offset="0.55" stop-color="white" stop-opacity="0.06"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="puHalo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(106 100) scale(44 44)">
      <stop stop-color="#8A7EE8" stop-opacity="0.28"/><stop offset="1" stop-color="#8A7EE8" stop-opacity="0"/>
    </radialGradient>

    <!-- chat bubble: violet clay -->
    <radialGradient id="puBub0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(96 81) scale(50 46)">
      <stop stop-color="#D8D4FA"/><stop offset="0.35" stop-color="#B5B7F6"/><stop offset="0.7" stop-color="#8A7EE8"/><stop offset="1" stop-color="#6E60C8"/>
    </radialGradient>
    <radialGradient id="puBub1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(108 106) scale(36 30)">
      <stop stop-opacity="0"/><stop offset="0.65" stop-opacity="0"/><stop offset="1" stop-color="#2A1A5E" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="puBub2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(92 81) scale(17 10)">
      <stop stop-color="white" stop-opacity="0.45"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="puDot" cx="36%" cy="30%" r="78%">
      <stop stop-color="white"/><stop offset="0.5" stop-color="#F0EDF8"/><stop offset="1" stop-color="#D6D1EA"/>
    </radialGradient>

    <!-- badge: glossy green clay (password-reset-success.svg, scaled to r=22) -->
    <radialGradient id="puOk0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(157.6 150.9) scale(28.6 28.8)">
      <stop stop-color="#78F0C0"/><stop offset="0.5" stop-color="#2ECB8C"/><stop offset="1" stop-color="#0C6E48"/>
    </radialGradient>
    <radialGradient id="puOk1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(155.4 148.7) scale(12.3 12.4)">
      <stop stop-color="white" stop-opacity="0.7"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="puTick" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160.5 158.9) scale(11.7 9.2)">
      <stop stop-color="white"/><stop offset="1" stop-color="#E8F8F0"/>
    </radialGradient>
  </defs>
</svg>
