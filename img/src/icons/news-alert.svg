  <path d="M76.5 58H137.5A8.5 8.5 0 0 1 146 66.5V66.5A8.5 8.5 0 0 1 137.5 75H76.5A8.5 8.5 0 0 1 68 66.5V66.5A8.5 8.5 0 0 1 76.5 58Z" fill="url(#nwHd1)"/>
