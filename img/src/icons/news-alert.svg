<svg width="232" height="235" viewBox="0 0 232 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- humAIne clay: lilac folded newspaper (violet headline bar, white text bars, white image block) with a white badge, violet bell: an organisation you follow made the news. -->

  <!-- confetti + glints, as in the app set -->
