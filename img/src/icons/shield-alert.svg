<svg width="232" height="235" viewBox="0 0 232 235" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- shield body : deeper lilac clay -->
  <radialGradient id="shB" cx="36%" cy="22%" r="80%">
    <stop offset="0" stop-color="#E5C3F0"/>
    <stop offset="0.3" stop-color="#D4A2E6"/>
    <stop offset="0.7" stop-color="#B570CC"/>
    <stop offset="1" stop-color="#7A3E96"/>
  </radialGradient>
  <radialGradient id="shAO" cx="56%" cy="96%" r="66%">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A1850" stop-opacity="0.66"/>
  </radialGradient>
  <!-- rim bevel : perimeter falloff so the outer edge reads as a thick, rounded slab -->
  <radialGradient id="shEdge" cx="46%" cy="40%" r="62%">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="0.74" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#3A1850" stop-opacity="0.42"/>
  </radialGradient>
  <radialGradient id="shHi" cx="24%" cy="13%" r="32%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>

  <!-- raised face plate : lighter lilac clay -->
  <radialGradient id="fcB" cx="36%" cy="24%" r="78%">
    <stop offset="0" stop-color="#F0D6F8"/>
    <stop offset="0.3" stop-color="#E5C3F0"/>
    <stop offset="0.7" stop-color="#C48DD8"/>
    <stop offset="1" stop-color="#8E56A8"/>
  </radialGradient>
  <radialGradient id="fcAO" cx="55%" cy="90%" r="58%">
    <stop offset="0" stop-color="#000000" stop-opacity="0"/>
    <stop offset="0.65" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#472858" stop-opacity="0.5"/>
  </radialGradient>
  <radialGradient id="fcHi" cx="30%" cy="17%" r="33%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>

  <!-- keyhole disc : white clay -->
  <radialGradient id="dsB" cx="38%" cy="26%" r="72%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.5" stop-color="#F0EDF8"/>
    <stop offset="1" stop-color="#D6D1EA"/>
  </radialGradient>
  <radialGradient id="dsHi" cx="32%" cy="20%" r="30%">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>

  <!-- glossy coral alert badge -->
  <radialGradient id="alB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170.6 56.4) scale(35.5)">
    <stop offset="0" stop-color="#FFD0D0"/>
    <stop offset="0.26" stop-color="#F58B8B"/>
    <stop offset="0.62" stop-color="#D9534F"/>
    <stop offset="1" stop-color="#A33A3A"/>
  </radialGradient>
  <radialGradient id="alHi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(167.9 53.7) scale(15.4)">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="alG" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(176 68) scale(16 22)">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FBEAEA"/>
  </radialGradient>

  <!-- tick marks around the badge -->
  <radialGradient id="tkG" cx="40%" cy="30%" r="60%">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.5" stop-color="#F0EDF8"/>
    <stop offset="1" stop-color="#D6D1EA"/>
  </radialGradient>

  <filter id="floor" x="40" y="180" width="130" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
  <filter id="plate" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3A1850" flood-opacity="0.45"/>
  </filter>
  <filter id="soft" x="-40%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2A0F3A" flood-opacity="0.4"/>
  </filter>
  <filter id="tiny" x="-60%" y="-50%" width="220%" height="220%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#08041A" flood-opacity="0.25"/>
  </filter>
  <filter id="glint" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="1.85"/></filter>
</defs>

<!-- floor shadow -->
<g opacity="0.3" filter="url(#floor)">
  <ellipse cx="104" cy="203" rx="50" ry="9" fill="black"/>
</g>

<!-- shield body -->
<path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#shB)"/>
<path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#shAO)"/>
<path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#shHi)"/>
<path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#shEdge)"/>

<!-- raised face plate -->
<g filter="url(#plate)">
  <g transform="translate(27.04 24.96) scale(0.74)">
    <path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#fcB)"/>
    <path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#fcAO)"/>
    <path d="M104 31C125 31 148 39 165 45Q182 51 182 69V104C182 150 150 182 113 199Q104 203.5 95 199C58 182 26 150 26 104V69Q26 51 43 45C60 39 83 31 104 31Z" fill="url(#fcHi)"/>
  </g>
</g>

<!-- keyhole disc -->
<g filter="url(#tiny)">
  <circle cx="104" cy="112" r="20" fill="url(#dsB)"/>
  <circle cx="104" cy="112" r="20" fill="url(#dsHi)"/>
</g>
<circle cx="104.4" cy="108.6" r="7.6" fill="#8E56A8"/>
<rect x="100.3" y="110" width="8.2" height="16.5" rx="4.1" fill="#8E56A8"/>

<!-- alert ticks -->
<g filter="url(#tiny)">
  <rect x="199" y="37" width="16" height="5.5" rx="2.75" fill="url(#tkG)" transform="rotate(-38 207 39.75)"/>
  <rect x="208" y="63" width="18" height="5.5" rx="2.75" fill="url(#tkG)" transform="rotate(-6 217 65.75)"/>
  <rect x="202" y="89" width="14" height="5.5" rx="2.75" fill="url(#tkG)" transform="rotate(26 209 91.75)"/>
</g>

<!-- glossy coral badge -->
<g filter="url(#soft)">
  <circle cx="176" cy="70" r="27" fill="url(#alB)"/>
  <circle cx="176" cy="70" r="27" fill="url(#alHi)"/>
</g>
<path d="M176 57.5V72.5" stroke="url(#alG)" stroke-width="6.4" stroke-linecap="round"/>
<circle cx="176" cy="82.2" r="3.7" fill="url(#alG)"/>

<!-- confetti + glints, as in the app set -->
<path d="M22.4 78.6L19.3 77.2C18.4 76.8 17.4 77.2 17 78.0L15.5 81.2C15.1 82.1 15.5 83.1 16.3 83.5L19.5 85.0C20.4 85.4 21.4 85.0 21.8 84.1L23.2 81.0C23.7 80.1 23.3 79.1 22.4 78.6Z" fill="#FFD166"/>
<path d="M193.2 172.8L189.9 173.7C189.3 173.9 188.9 174.5 189.1 175.1L190 178.5C190.1 179.1 190.8 179.5 191.4 179.3L194.7 178.4C195.4 178.2 195.7 177.6 195.6 177.0L194.7 173.6C194.5 173.0 193.9 172.6 193.2 172.8Z" fill="#8B7FFF"/>
<circle cx="24" cy="186" r="3.5" fill="#FF9AC4"/>
<path d="M205 128.5L202.8 129.3C201.9 129.6 201.5 130.6 201.8 131.5L202.6 133.7C202.9 134.6 203.9 135 204.8 134.7L207 133.9C207.9 133.6 208.3 132.6 208 131.7L207.2 129.5C206.9 128.6 205.9 128.2 205 128.5Z" fill="#7DE8FF"/>
<g opacity="0.6" filter="url(#glint)"><circle cx="56" cy="36" r="1.7" fill="white"/></g>
<g opacity="0.35" filter="url(#glint)"><circle cx="12" cy="128" r="3.5" fill="white"/></g>
</svg>
