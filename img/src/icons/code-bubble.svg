<svg width="232" height="235" viewBox="0 0 232 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- humAIne clay: lilac speech bubble (body from the app's thankyou-bubble.svg) carrying a masked six-dot code, with a white clock badge. One-time code, short fuse. -->

  <!-- floor shadow -->
  <g opacity="0.3" filter="url(#cb_floor)">
    <ellipse cx="104" cy="221" rx="64" ry="9.5" fill="black"/>
  </g>

  <!-- bubble thickness -->
  <path d="M52.8 57H149.6A30.8 30.8 0 0 1 180.4 87.8V147.2A30.8 30.8 0 0 1 149.6 178H110C105.6 191.2 94.6 204.4 79.2 213.2A14.3 14.3 0 0 1 58.3 196.7C62.7 190.1 66 183.5 68.2 178H52.8A30.8 30.8 0 0 1 22 147.2V87.8A30.8 30.8 0 0 1 52.8 57Z" fill="url(#cb_side)"/>
  <path d="M52.8 57H149.6A30.8 30.8 0 0 1 180.4 87.8V147.2A30.8 30.8 0 0 1 149.6 178H110C105.6 191.2 94.6 204.4 79.2 213.2A14.3 14.3 0 0 1 58.3 196.7C62.7 190.1 66 183.5 68.2 178H52.8A30.8 30.8 0 0 1 22 147.2V87.8A30.8 30.8 0 0 1 52.8 57Z" fill="url(#cb_sideShade)"/>

  <!-- bubble face : base, bottom shade, specular -->
  <path d="M52.8 50H149.6A30.8 30.8 0 0 1 180.4 80.8V140.2A30.8 30.8 0 0 1 149.6 171H110C105.6 184.2 94.6 197.4 79.2 206.2A14.3 14.3 0 0 1 58.3 189.7C62.7 183.1 66 176.5 68.2 171H52.8A30.8 30.8 0 0 1 22 140.2V80.8A30.8 30.8 0 0 1 52.8 50Z" fill="url(#cb_body)"/>
  <path d="M52.8 50H149.6A30.8 30.8 0 0 1 180.4 80.8V140.2A30.8 30.8 0 0 1 149.6 171H110C105.6 184.2 94.6 197.4 79.2 206.2A14.3 14.3 0 0 1 58.3 189.7C62.7 183.1 66 176.5 68.2 171H52.8A30.8 30.8 0 0 1 22 140.2V80.8A30.8 30.8 0 0 1 52.8 50Z" fill="url(#cb_bodyShade)"/>
  <path d="M52.8 50H149.6A30.8 30.8 0 0 1 180.4 80.8V140.2A30.8 30.8 0 0 1 149.6 171H110C105.6 184.2 94.6 197.4 79.2 206.2A14.3 14.3 0 0 1 58.3 189.7C62.7 183.1 66 176.5 68.2 171H52.8A30.8 30.8 0 0 1 22 140.2V80.8A30.8 30.8 0 0 1 52.8 50Z" fill="url(#cb_bodyHi)"/>

  <!-- the code : six white clay dots, grouped 3 + 3 -->
  <g filter="url(#cb_dotBlur)" fill="#44185C" fill-opacity="0.5">
    <circle cx="46" cy="115.4" r="9.2"/>
    <circle cx="67" cy="115.4" r="9.2"/>
    <circle cx="88" cy="115.4" r="9.2"/>
    <circle cx="116" cy="115.4" r="9.2"/>
    <circle cx="137" cy="115.4" r="9.2"/>
    <circle cx="158" cy="115.4" r="9.2"/>
  </g>
  <g fill="url(#cb_pearl)">
    <circle cx="45.2" cy="111" r="9"/>
    <circle cx="66.2" cy="111" r="9"/>
    <circle cx="87.2" cy="111" r="9"/>
    <circle cx="115.2" cy="111" r="9"/>
    <circle cx="136.2" cy="111" r="9"/>
    <circle cx="157.2" cy="111" r="9"/>
  </g>
  <g fill="url(#cb_pearlShade)">
    <circle cx="45.2" cy="111" r="9"/>
    <circle cx="66.2" cy="111" r="9"/>
    <circle cx="87.2" cy="111" r="9"/>
    <circle cx="115.2" cy="111" r="9"/>
    <circle cx="136.2" cy="111" r="9"/>
    <circle cx="157.2" cy="111" r="9"/>
  </g>

  <!-- clock badge : soft plum contact shadow, white clay disc, specular, violet glyph -->
  <g opacity="0.45" filter="url(#cb_badgeBlur)">
    <circle cx="179" cy="61" r="29" fill="#3A1850"/>
  </g>
  <circle cx="178" cy="57" r="30" fill="url(#cb_badge)"/>
  <circle cx="178" cy="57" r="30" fill="url(#cb_badgeShade)"/>
  <circle cx="178" cy="57" r="30" fill="url(#cb_badgeHi)"/>
  <circle cx="178" cy="57" r="20.2" stroke="url(#cb_glyph)" stroke-width="3.4"/>
  <path d="M178 44V57L188.4 62.4" stroke="url(#cb_glyph)" stroke-width="3.9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="178" cy="57" r="2.8" fill="#4B33C2"/>

  <defs>
    <filter id="cb_floor" x="30" y="201" width="148" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="cb_dotBlur" x="30" y="97" width="146" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
    <filter id="cb_badgeBlur" x="140" y="22" width="78" height="78" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>

    <!-- thickness (as keypad.svg tile) -->
    <linearGradient id="cb_side" x1="101" y1="150" x2="101" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A866C2"/>
      <stop offset="1" stop-color="#6A3286"/>
    </linearGradient>
    <radialGradient id="cb_sideShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 172) scale(104 80)">
      <stop stop-opacity="0"/>
      <stop offset="0.6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A1850" stop-opacity="0.5"/>
    </radialGradient>

    <!-- lilac clay body, lit from top-left -->
    <radialGradient id="cb_body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(68 74) scale(162 152)">
      <stop stop-color="#F0D6F8"/>
      <stop offset="0.3" stop-color="#E5C3F0"/>
      <stop offset="0.7" stop-color="#C48DD8"/>
      <stop offset="1" stop-color="#8E56A8"/>
    </radialGradient>
    <radialGradient id="cb_bodyShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 160) scale(104 82)">
      <stop stop-opacity="0"/>
      <stop offset="0.65" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A1850" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="cb_bodyHi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(58 72) scale(50 38)">
      <stop stop-color="white" stop-opacity="0.7"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- white clay dots -->
    <radialGradient id="cb_pearl" cx="36%" cy="30%" r="78%">
      <stop stop-color="white"/>
      <stop offset="0.5" stop-color="#F0EDF8"/>
      <stop offset="1" stop-color="#D6D1EA"/>
    </radialGradient>
    <radialGradient id="cb_pearlShade" cx="46%" cy="38%" r="68%">
      <stop stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3C86" stop-opacity="0.22"/>
    </radialGradient>

    <!-- badge -->
    <radialGradient id="cb_badge" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(172 42) scale(39 38)">
      <stop stop-color="white"/>
      <stop offset="0.5" stop-color="#F0EDF8"/>
      <stop offset="1" stop-color="#D6D1EA"/>
    </radialGradient>
    <radialGradient id="cb_badgeShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(182 69) scale(35 33)">
      <stop stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3C86" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="cb_badgeHi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(169 40) scale(17 16.5)">
      <stop stop-color="white" stop-opacity="0.6"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cb_glyph" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(169 45) scale(37 37)">
      <stop stop-color="#8A7EE8"/>
      <stop offset="0.45" stop-color="#6E60C8"/>
      <stop offset="1" stop-color="#4227B8"/>
    </radialGradient>
  </defs>
</svg>
