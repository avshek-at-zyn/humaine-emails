<svg width="232" height="235" viewBox="0 0 232 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- humAIne clay icon: backup codes regenerated. Chunky lilac clay card holding a 2x4 grid of white code bars, white refresh badge.
       Same base as codes-viewed.svg; only the badge glyph differs. -->

  <!-- ambient flecks (same vocabulary as password-reset-success.svg) -->
  <g opacity="0.3">
    <path d="M28 44L36 52" stroke="#FFE9B3" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M212 96V108" stroke="#FFE9B3" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g opacity="0.6" filter="url(#cnBlurS)"><circle cx="26" cy="118" r="1.8" fill="white"/></g>
  <rect x="198" y="136" width="7" height="7" rx="1.8" transform="rotate(-20 201.5 139.5)" fill="#7DE8FF"/>
  <rect x="20" y="164" width="6.5" height="6.5" rx="1.6" transform="rotate(25 23.25 167.25)" fill="#8B7FFF"/>
  <circle cx="196" cy="198" r="3.4" fill="#FF9AC4"/>
  <rect x="26" y="80" width="6" height="6" rx="1.5" transform="rotate(-14 29 83)" fill="#FFD166"/>

  <!-- floor shadow -->
  <g opacity="0.3" filter="url(#cnFloor)">
    <ellipse cx="105" cy="211" rx="62" ry="9.5" fill="black"/>
  </g>

  <!-- card thickness -->
  <rect x="42" y="52" width="124" height="148" rx="26" fill="url(#cnSide)"/>
  <rect x="42" y="52" width="124" height="148" rx="26" fill="url(#cnSideShade)"/>

  <!-- card face : base / bottom shade / specular -->
  <rect x="42" y="42" width="124" height="148" rx="26" fill="url(#cnFace0)"/>
  <rect x="42" y="42" width="124" height="148" rx="26" fill="url(#cnFace1)"/>
  <rect x="42" y="42" width="124" height="148" rx="26" fill="url(#cnFace2)"/>

  <!-- code bars : 2 columns x 4 rows of raised white clay -->
  <g filter="url(#cnBarBlur)" fill="#44185C" fill-opacity="0.5">
    <rect x="60.8" y="76" width="38" height="13" rx="6.5"/>
    <rect x="110.8" y="76" width="38" height="13" rx="6.5"/>
    <rect x="60.8" y="101" width="38" height="13" rx="6.5"/>
    <rect x="110.8" y="101" width="38" height="13" rx="6.5"/>
    <rect x="60.8" y="126" width="38" height="13" rx="6.5"/>
    <rect x="110.8" y="126" width="38" height="13" rx="6.5"/>
    <rect x="60.8" y="151" width="38" height="13" rx="6.5"/>
    <rect x="110.8" y="151" width="38" height="13" rx="6.5"/>
  </g>
  <g fill="url(#cnBar0)">
    <rect x="60" y="72" width="38" height="13" rx="6.5"/>
    <rect x="110" y="72" width="38" height="13" rx="6.5"/>
    <rect x="60" y="97" width="38" height="13" rx="6.5"/>
    <rect x="110" y="97" width="38" height="13" rx="6.5"/>
    <rect x="60" y="122" width="38" height="13" rx="6.5"/>
    <rect x="110" y="122" width="38" height="13" rx="6.5"/>
    <rect x="60" y="147" width="38" height="13" rx="6.5"/>
    <rect x="110" y="147" width="38" height="13" rx="6.5"/>
  </g>
  <g fill="url(#cnBar1)">
    <rect x="60" y="72" width="38" height="13" rx="6.5"/>
    <rect x="110" y="72" width="38" height="13" rx="6.5"/>
    <rect x="60" y="97" width="38" height="13" rx="6.5"/>
    <rect x="110" y="97" width="38" height="13" rx="6.5"/>
    <rect x="60" y="122" width="38" height="13" rx="6.5"/>
    <rect x="110" y="122" width="38" height="13" rx="6.5"/>
    <rect x="60" y="147" width="38" height="13" rx="6.5"/>
    <rect x="110" y="147" width="38" height="13" rx="6.5"/>
  </g>

  <!-- badge : plum contact shadow, white clay disc, specular, violet refresh glyph -->
  <g opacity="0.45" filter="url(#cnBadgeBlur)">
    <circle cx="167" cy="52" r="23" fill="#3A1850"/>
  </g>
  <circle cx="166" cy="48" r="23" fill="url(#cnBadge0)"/>
  <circle cx="166" cy="48" r="23" fill="url(#cnBadge1)"/>
  <circle cx="166" cy="48" r="23" fill="url(#cnBadge2)"/>
  <g transform="translate(166 48)">
    <path d="M-10.149 -3.694A10.8 10.8 0 0 1 8.273 -6.942" stroke="url(#cnGlyph)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M10.149 3.694A10.8 10.8 0 0 1 -8.273 6.942" stroke="url(#cnGlyph)" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M11.745 -2.806L11.950 -10.028L4.596 -3.856Z" fill="url(#cnGlyph)" stroke="url(#cnGlyph)" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-11.745 2.806L-11.950 10.028L-4.596 3.856Z" fill="url(#cnGlyph)" stroke="url(#cnGlyph)" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <defs>
    <filter id="cnFloor" x="33" y="191" width="144" height="40" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="cnBarBlur" x="50" y="66" width="110" height="108" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.1"/>
    </filter>
    <filter id="cnBadgeBlur" x="134" y="19" width="66" height="66" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="cnBlurS" x="20" y="112" width="12" height="12" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

    <!-- thickness (as keypad.svg tile) -->
    <linearGradient id="cnSide" x1="104" y1="170" x2="104" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A866C2"/>
      <stop offset="1" stop-color="#6A3286"/>
    </linearGradient>
    <radialGradient id="cnSideShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(116 192) scale(80 74)">
      <stop stop-opacity="0"/>
      <stop offset="0.6" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A1850" stop-opacity="0.5"/>
    </radialGradient>

    <!-- face : lilac clay, lit from top-left -->
    <radialGradient id="cnFace0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(78 70) scale(132 150)">
      <stop stop-color="#F0D6F8"/>
      <stop offset="0.3" stop-color="#E5C3F0"/>
      <stop offset="0.7" stop-color="#C48DD8"/>
      <stop offset="1" stop-color="#8E56A8"/>
    </radialGradient>
    <radialGradient id="cnFace1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 176) scale(80 92)">
      <stop stop-opacity="0"/>
      <stop offset="0.65" stop-opacity="0"/>
      <stop offset="1" stop-color="#472858" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="cnFace2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(66 60) scale(42 34)">
      <stop stop-color="white" stop-opacity="0.65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- code bars : white clay -->
    <radialGradient id="cnBar0" cx="36%" cy="24%" r="86%">
      <stop stop-color="white"/>
      <stop offset="0.5" stop-color="#F0EDF8"/>
      <stop offset="1" stop-color="#D6D1EA"/>
    </radialGradient>
    <radialGradient id="cnBar1" cx="46%" cy="34%" r="70%">
      <stop stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3C86" stop-opacity="0.22"/>
    </radialGradient>

    <!-- badge : white clay disc -->
    <radialGradient id="cnBadge0" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(161.4 36.6) scale(30 29.4)">
      <stop stop-color="white"/>
      <stop offset="0.5" stop-color="#F0EDF8"/>
      <stop offset="1" stop-color="#D6D1EA"/>
    </radialGradient>
    <radialGradient id="cnBadge1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(169 57) scale(27 25)">
      <stop stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#5A3C86" stop-opacity="0"/>
      <stop offset="1" stop-color="#5A3C86" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="cnBadge2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(159.5 35) scale(13 12.6)">
      <stop stop-color="white" stop-opacity="0.6"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <!-- glyph gradient lives in the glyph group's local space (origin = badge centre) -->
    <radialGradient id="cnGlyph" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(-8 -9) scale(30 30)">
      <stop stop-color="#8A7EE8"/>
      <stop offset="0.45" stop-color="#6E60C8"/>
      <stop offset="1" stop-color="#4227B8"/>
    </radialGradient>
  </defs>
</svg>
