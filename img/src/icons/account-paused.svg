<!-- head : base, bottom shade, specular -->
<path d="M102.5 120C124.012 120 141.45 102.987 141.45 82C141.45 61.0132 124.012 44 102.5 44C80.9886 44 63.55 61.0132 63.55 82C63.55 102.987 80.9886 120 102.5 120Z" fill="url(#ap_head)"/>
<path d="M102.5 120C124.012 120 141.45 102.987 141.45 82C141.45 61.0132 124.012 44 102.5 44C80.9886 44 63.55 61.0132 63.55 82C63.55 102.987 80.9886 120 102.5 120Z" fill="url(#ap_headShade)"/>
<path d="M102.5 120C124.012 120 141.45 102.987 141.45 82C141.45 61.0132 124.012 44 102.5 44C80.9886 44 63.55 61.0132 63.55 82C63.55 102.987 80.9886 120 102.5 120Z" fill="url(#ap_headHi)"/>

<!-- glossy coral badge -->
<g filter="url(#ap_soft)">
  <circle cx="161" cy="141" r="25" fill="url(#ap_alB)"/>
  <circle cx="161" cy="141" r="25" fill="url(#ap_alHi)"/>
</g>

<!-- pause glyph -->
<rect x="151.4" y="131" width="6.4" height="20" rx="3.2" fill="url(#ap_alG)"/>
<rect x="164.2" y="131" width="6.4" height="20" rx="3.2" fill="url(#ap_alG)"/>

<defs>
  <radialGradient id="ap_body" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(88.15 121.6) scale(103.32 56.16)">
    <stop stop-color="#E5C3F0"/><stop offset="0.3" stop-color="#D4A2E6"/><stop offset="0.7" stop-color="#B570CC"/><stop offset="1" stop-color="#7A3E96"/>
  </radialGradient>
  <radialGradient id="ap_bodyShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(109.675 176.2) scale(78.925 42.9)">
    <stop stop-opacity="0"/><stop offset="0.65" stop-opacity="0"/><stop offset="1" stop-color="#3A1850" stop-opacity="0.5"/>
  </radialGradient>
  <radialGradient id="ap_bodyHi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(73.8 116.92) scale(37.31 20.28)">
    <stop stop-color="white" stop-opacity="0.6"/><stop offset="1" stop-color="white" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ap_head" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(93.1521 60.72) scale(56.088 54.72)">
