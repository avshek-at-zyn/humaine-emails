<svg width="205" height="205" viewBox="0 0 205 205" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- humAIne clay: the person from the app's administrator-icon.svg, wearing the glossy coral alert badge from shield-alert.svg with a white pause glyph. Account suspended while we look into it. -->

