  </radialGradient>
  <radialGradient id="ap_headShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(106.395 108.6) scale(42.845 41.8)">
    <stop stop-opacity="0"/><stop offset="0.65" stop-opacity="0"/><stop offset="1" stop-color="#472858" stop-opacity="0.5"/>
  </radialGradient>
  <radialGradient id="ap_headHi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(86.92 56.16) scale(21.812 21.28)">
    <stop stop-color="white" stop-opacity="0.7"/><stop offset="1" stop-color="white" stop-opacity="0"/>
  </radialGradient>

