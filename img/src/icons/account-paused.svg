<path d="M30.75 142C30.75 126 39.6333 116 57.4 112L102.5 106L147.6 112C165.367 116 174.25 126 174.25 142V176C174.25 181.333 171.517 184 166.05 184H38.95C33.4833 184 30.75 181.333 30.75 176V142Z" fill="url(#ap_bodyShade)"/>
