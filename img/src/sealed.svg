<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540">
  <defs>
    <radialGradient id="sglow" cx="63%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#5271FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C3F0"/>
      <stop offset="55%" stop-color="#B5B7F6"/>
      <stop offset="100%" stop-color="#5271FF"/>
    </linearGradient>
    <filter id="sblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="sblur2" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="ssoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="1260" height="540" fill="#180A24"/>
  <rect width="1260" height="540" fill="url(#sglow)"/>

  <!-- soft ring of light around the lock -->
  <circle cx="800" cy="280" r="188" fill="none" stroke="#B5B7F6" stroke-width="7" opacity="0.4" filter="url(#sblur)"/>
  <circle cx="800" cy="280" r="188" fill="none" stroke="#B5B7F6" stroke-width="1.5" opacity="0.26" filter="url(#ssoft)"/>

  <!-- padlock : glow underlayer -->
  <g filter="url(#sblur)" opacity="0.6">
    <path d="M 750 240 L 750 198 A 50 50 0 0 1 850 198 L 850 240" fill="none" stroke="#5271FF" stroke-width="30" stroke-linecap="round"/>
    <rect x="716" y="238" width="168" height="140" rx="22" fill="none" stroke="#5271FF" stroke-width="28"/>
    <circle cx="800" cy="292" r="20" fill="#5271FF"/>
  </g>

  <!-- padlock : crisp layer -->
  <g filter="url(#ssoft)">
    <path d="M 750 240 L 750 198 A 50 50 0 0 1 850 198 L 850 240" fill="none" stroke="url(#sg)" stroke-width="13" stroke-linecap="round"/>
    <rect x="716" y="238" width="168" height="140" rx="22" fill="#180A24" stroke="url(#sg)" stroke-width="13"/>
    <path d="M 729 264 L 871 264" stroke="#B5B7F6" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="800" cy="292" r="17" fill="url(#sg)"/>
    <path d="M 791 301 L 809 301 L 816 346 L 784 346 Z" fill="url(#sg)"/>
  </g>

  <!-- mint tick badge -->
  <circle cx="886" cy="372" r="30" fill="#ACE1E4" opacity="0.45" filter="url(#sblur2)"/>
  <g filter="url(#ssoft)">
    <circle cx="886" cy="372" r="28" fill="#180A24" stroke="#ACE1E4" stroke-width="4"/>
    <path d="M 873 372 L 882 382 L 900 361" fill="none" stroke="#ACE1E4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tiny stars -->
  <circle cx="330" cy="140" r="3" fill="#E5C3F0" opacity="0.8"/>
  <circle cx="250" cy="400" r="2.2" fill="#B5B7F6" opacity="0.55"/>
  <circle cx="1130" cy="120" r="2.4" fill="#B5B7F6" opacity="0.6"/>
  <circle cx="1180" cy="430" r="1.8" fill="#E5C3F0" opacity="0.5"/>
  <circle cx="140" cy="250" r="1.6" fill="#5271FF" opacity="0.7"/>
  <circle cx="520" cy="470" r="2" fill="#ACE1E4" opacity="0.45"/>
</svg>
