<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540">
  <defs>
    <radialGradient id="gtint" cx="70%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5271FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gdoor" cx="50%" cy="58%" r="60%">
      <stop offset="0%" stop-color="#E5C3F0" stop-opacity="0.7"/>
      <stop offset="45%" stop-color="#B5B7F6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C3F0"/>
      <stop offset="55%" stop-color="#B5B7F6"/>
      <stop offset="100%" stop-color="#5271FF"/>
    </linearGradient>
    <linearGradient id="ginner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C3F0" stop-opacity="0"/>
      <stop offset="70%" stop-color="#E5C3F0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E5C3F0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="gpath" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E5C3F0" stop-opacity="0.72"/>
      <stop offset="40%" stop-color="#B5B7F6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="gblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="gsoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="1260" height="540" fill="#180A24"/>
  <rect width="1260" height="540" fill="url(#gtint)"/>

  <!-- light standing in the doorway -->
  <ellipse cx="890" cy="320" rx="150" ry="195" fill="url(#gdoor)" filter="url(#gblur)"/>
  <rect x="812" y="112" width="156" height="340" fill="url(#ginner)"/>

  <!-- path of light leading in from the left -->
  <polygon points="818,452 962,452 690,540 250,540" fill="url(#gpath)" opacity="0.85"/>
  <polygon points="818,452 962,452 690,540 250,540" fill="url(#gpath)" opacity="0.5" filter="url(#gblur)"/>

  <!-- stepping glints along the path -->
  <rect x="436" y="506" width="28" height="5" rx="2.5" fill="#B5B7F6" opacity="0.45" transform="rotate(-7 450 508)"/>
  <rect x="566" y="488" width="22" height="4.5" rx="2.25" fill="#B5B7F6" opacity="0.55" transform="rotate(-7 577 490)"/>
  <rect x="682" y="470" width="17" height="4" rx="2" fill="#E5C3F0" opacity="0.65" transform="rotate(-7 690 472)"/>

  <!-- ambient streaks, left field -->
  <rect x="120" y="292" width="210" height="3" rx="1.5" fill="#B5B7F6" opacity="0.28"/>
  <rect x="190" y="336" width="120" height="2.5" rx="1.25" fill="#B5B7F6" opacity="0.18"/>

  <!-- gate pillars : glow underlayer -->
  <g filter="url(#gblur)" opacity="0.6">
    <rect x="780" y="96" width="28" height="360" rx="14" fill="#5271FF"/>
    <rect x="972" y="96" width="28" height="360" rx="14" fill="#5271FF"/>
  </g>

  <!-- gate pillars : crisp layer -->
  <g filter="url(#gsoft)">
    <rect x="788" y="100" width="14" height="352" rx="7" fill="url(#gg)"/>
    <rect x="978" y="100" width="14" height="352" rx="7" fill="url(#gg)"/>
    <rect x="770" y="82" width="50" height="8" rx="4" fill="url(#gg)" opacity="0.9"/>
    <rect x="960" y="82" width="50" height="8" rx="4" fill="url(#gg)" opacity="0.9"/>
    <rect x="788" y="450" width="204" height="4" rx="2" fill="url(#gg)" opacity="0.9"/>
  </g>

  <!-- inner light edges on the pillars -->
  <rect x="806" y="130" width="2.5" height="305" rx="1.25" fill="#E5C3F0" opacity="0.5"/>
  <rect x="971.5" y="130" width="2.5" height="305" rx="1.25" fill="#E5C3F0" opacity="0.5"/>

  <!-- small orbiting dots -->
  <circle cx="620" cy="92" r="3" fill="#E5C3F0" opacity="0.8"/>
  <circle cx="518" cy="336" r="2" fill="#B5B7F6" opacity="0.5"/>
  <circle cx="1142" cy="122" r="2.4" fill="#B5B7F6" opacity="0.6"/>
  <circle cx="1186" cy="424" r="1.8" fill="#E5C3F0" opacity="0.5"/>
  <circle cx="146" cy="118" r="1.6" fill="#5271FF" opacity="0.7"/>
  <circle cx="322" cy="212" r="1.7" fill="#B5B7F6" opacity="0.4"/>
</svg>
