<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540">
  <defs>
    <radialGradient id="sglow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#5271FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="f1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2E3FB8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="f2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5B7F6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="f3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C3F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B5B7F6" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="sblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="edge" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="1260" height="540" fill="#180A24"/>
  <rect width="1260" height="540" fill="url(#sglow)"/>

  <!-- glow mass behind shard -->
  <polygon points="380,80 560,150 585,330 380,470 175,330 200,150" fill="#5271FF" opacity="0.5" filter="url(#sblur)"/>

  <!-- faceted shard : shield silhouette built from triangles -->
  <g filter="url(#edge)">
    <polygon points="380,80 560,150 380,215" fill="url(#f2)"/>
    <polygon points="380,80 200,150 380,215" fill="url(#f1)"/>
    <polygon points="200,150 380,215 175,330" fill="url(#f1)" opacity="0.85"/>
    <polygon points="560,150 380,215 585,330" fill="url(#f2)" opacity="0.8"/>
    <polygon points="175,330 380,215 380,470" fill="url(#f2)" opacity="0.55"/>
    <polygon points="585,330 380,215 380,470" fill="url(#f1)" opacity="0.7"/>
  </g>
  <!-- crisp edge lines -->
  <g stroke="#E5C3F0" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <polygon points="380,80 560,150 585,330 380,470 175,330 200,150"/>
    <path d="M 200 150 L 380 215 L 560 150 M 175 330 L 380 215 L 585 330 M 380 215 L 380 470"/>
  </g>
  <!-- keyhole notch of light at the centre -->
  <circle cx="380" cy="255" r="16" fill="none" stroke="url(#f3)" stroke-width="4"/>
  <rect x="374" y="268" width="12" height="34" rx="6" fill="url(#f3)"/>

  <!-- scanning beam -->
  <rect x="700" y="252" width="420" height="2.5" fill="url(#f3)" opacity="0.55"/>
  <circle cx="1120" cy="253" r="5" fill="#E5C3F0" filter="url(#edge)"/>

  <!-- stars -->
  <circle cx="880" cy="120" r="2.2" fill="#B5B7F6" opacity="0.6"/>
  <circle cx="1010" cy="400" r="1.8" fill="#E5C3F0" opacity="0.55"/>
  <circle cx="760" cy="440" r="1.5" fill="#5271FF" opacity="0.7"/>
  <circle cx="1160" cy="90" r="2.4" fill="#E5C3F0" opacity="0.65"/>
</svg>
