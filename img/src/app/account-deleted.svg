<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="bg" cx="50%" cy="45%" r="52%"><stop offset="0%" stop-color="#1A1040"/><stop offset="100%" stop-color="#0C0820"/></radialGradient>
<radialGradient id="aura" cx="50%" cy="46%" r="46%"><stop offset="0%" stop-color="#E54040" stop-opacity="0.14"/><stop offset="100%" stop-color="#E54040" stop-opacity="0"/></radialGradient>
<radialGradient id="neb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E5C3F0" stop-opacity="0.12"/><stop offset="100%" stop-color="#E5C3F0" stop-opacity="0"/></radialGradient>

<!-- Avatar — muted/dimmed lilac (account is gone) -->
<radialGradient id="avB" cx="36%" cy="20%" r="72%"><stop offset="0%" stop-color="#D4BDE0"/><stop offset="25%" stop-color="#BCA4CC"/><stop offset="60%" stop-color="#9A72B0"/><stop offset="100%" stop-color="#6B4080"/></radialGradient>
<radialGradient id="avAO" cx="58%" cy="86%" r="55%"><stop offset="0%" stop-color="#000000" stop-opacity="0"/><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#3A1E4E" stop-opacity="0.6"/></radialGradient>
<radialGradient id="avHi" cx="28%" cy="14%" r="26%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>

<!-- Person — muted white (faded) -->
<radialGradient id="prs" cx="38%" cy="22%" r="55%"><stop offset="0%" stop-color="#E0D8E8"/><stop offset="50%" stop-color="#C8C0D4"/><stop offset="100%" stop-color="#A8A0B8"/></radialGradient>

<!-- Red prohibition ring -->
<radialGradient id="rdRing" cx="36%" cy="20%" r="72%"><stop offset="0%" stop-color="#FF8A8A"/><stop offset="30%" stop-color="#E54040"/><stop offset="70%" stop-color="#C82828"/><stop offset="100%" stop-color="#A82020"/></radialGradient>
<radialGradient id="rdAO" cx="58%" cy="86%" r="55%"><stop offset="0%" stop-color="#000000" stop-opacity="0"/><stop offset="60%" stop-color="#000000" stop-opacity="0"/><stop offset="100%" stop-color="#600808" stop-opacity="0.45"/></radialGradient>
<radialGradient id="rdHi" cx="28%" cy="14%" r="26%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>

<!-- Slash bar — red -->
<radialGradient id="slB" cx="36%" cy="20%" r="70%"><stop offset="0%" stop-color="#FF8A8A"/><stop offset="40%" stop-color="#E54040"/><stop offset="100%" stop-color="#A82020"/></radialGradient>
<radialGradient id="slHi" cx="30%" cy="16%" r="26%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>

<!-- Shadows -->
<filter id="sM"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/></filter>
<filter id="sB"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/></filter>
<filter id="sS"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/></filter>
</defs>

<!-- Canvas -->
<rect width="200" height="200" rx="24" fill="url(#bg)"/>
<circle cx="155" cy="40" r="42" fill="url(#neb)"/>
<circle cx="22" cy="26" r="1.2" fill="#ffffff" opacity="0.5"/>
<circle cx="180" cy="174" r="1.3" fill="#ffffff" opacity="0.5"/>
<circle cx="24" cy="172" r="1" fill="#E5C3F0" opacity="0.4"/>
<circle cx="100" cy="100" r="80" fill="url(#aura)"/>

<!-- Dimmed avatar circle -->
<g filter="url(#sM)">
  <circle cx="100" cy="100" r="60" fill="url(#avB)"/>
  <circle cx="100" cy="100" r="60" fill="url(#avAO)"/>
  <circle cx="100" cy="100" r="60" fill="url(#avHi)"/>
</g>

<!-- Faded person head -->
<g filter="url(#sS)">
  <circle cx="100" cy="78" r="20" fill="url(#prs)"/>
</g>

<!-- Faded person shoulders -->
<g filter="url(#sS)">
  <path d="M68 138 Q68 114 84 110 L100 106 L116 110 Q132 114 132 138 Q132 146 124 146 L76 146 Q68 146 68 138 Z" fill="url(#prs)"/>
</g>

<!-- Chunky 3D prohibition ring -->
<g filter="url(#sB)">
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#rdRing)" stroke-width="12"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="url(#rdHi)" stroke-width="12"/>
</g>

<!-- Chunky 3D diagonal slash bar -->
<g filter="url(#sB)">
  <rect x="18" y="94" width="164" height="14" rx="7" fill="url(#slB)" transform="rotate(-45 100 100)"/>
  <rect x="18" y="94" width="164" height="14" rx="7" fill="url(#slHi)" transform="rotate(-45 100 100)"/>
</g>
</svg>