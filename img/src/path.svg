<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="540" viewBox="0 0 1260 540">
  <defs>
    <radialGradient id="pathglow" cx="25%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#5271FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#5271FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5271FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5271FF"/>
      <stop offset="60%" stop-color="#B5B7F6"/>
      <stop offset="100%" stop-color="#E5C3F0"/>
    </linearGradient>
    <filter id="tblur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="tsoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <rect width="1260" height="540" fill="#180A24"/>
  <rect width="1260" height="540" fill="url(#pathglow)"/>

  <!-- the path: strong, then breaking apart -->
  <path d="M -40 430 C 240 400, 320 250, 560 240" stroke="url(#trail)" stroke-width="60" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#tblur)"/>
  <path d="M -40 430 C 240 400, 320 250, 560 240" stroke="url(#trail)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#tsoft)"/>

  <!-- fragmenting segments -->
  <g stroke="#B5B7F6" stroke-linecap="round" filter="url(#tsoft)">
    <path d="M 600 238 L 668 234" stroke-width="13" opacity="0.9"/>
    <path d="M 706 230 L 756 226" stroke-width="11" opacity="0.75"/>
    <path d="M 792 224 L 828 221" stroke-width="9" opacity="0.6"/>
    <path d="M 862 219 L 888 217" stroke-width="7" opacity="0.5"/>
  </g>

  <!-- particles drifting where the path dissolves -->
  <g fill="#E5C3F0">
    <circle cx="920" cy="214" r="5" opacity="0.8"/>
    <circle cx="958" cy="200" r="4" opacity="0.65"/>
    <circle cx="990" cy="226" r="3.4" opacity="0.55"/>
    <circle cx="1028" cy="188" r="3" opacity="0.5"/>
    <circle cx="1062" cy="214" r="2.6" opacity="0.42"/>
    <circle cx="1096" cy="172" r="2.2" opacity="0.36"/>
    <circle cx="1128" cy="200" r="1.8" opacity="0.3"/>
    <circle cx="1160" cy="160" r="1.5" opacity="0.24"/>
    <circle cx="1190" cy="186" r="1.2" opacity="0.18"/>
  </g>

  <!-- destination marker, faint -->
  <circle cx="1150" cy="300" r="26" fill="none" stroke="#B5B7F6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="1150" cy="300" r="6" fill="#B5B7F6" opacity="0.4"/>

  <!-- stars -->
  <circle cx="200" cy="120" r="2.2" fill="#B5B7F6" opacity="0.6"/>
  <circle cx="420" cy="90" r="1.8" fill="#E5C3F0" opacity="0.5"/>
  <circle cx="1200" cy="450" r="2" fill="#5271FF" opacity="0.6"/>
</svg>
