<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>humAIne email templates</title>
<link rel="icon" href="img/brand/mark-96.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Hahmlet:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #090B14; color: #FFFFFF; font-family: 'DM Sans', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; overflow: hidden; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #1C1E27; flex-shrink: 0;
    background: radial-gradient(60% 140% at 50% -40%, rgba(167,139,250,0.22), transparent 70%), #090B14; }
  .topbar img { display: block; width: 144px; height: 36px; }
  .topbar .label { font-size: 12.5px; color: #7D7F8F; }
  .topbar .label b { color: #C4B5FD; font-weight: 600; }

  .layout { display: flex; flex: 1; min-height: 0; }

  .sidebar { width: 340px; flex-shrink: 0; border-right: 1px solid #1C1E27; overflow-y: auto; background: #0C0E17; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #23252E; border-radius: 3px; }
  .section { padding: 18px 20px 8px; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: #565869; }
  .section + .item { margin-top: 2px; }

  .item { display: flex; gap: 12px; align-items: center; padding: 11px 16px 11px 18px; cursor: pointer; border-left: 2px solid transparent; transition: background .15s, border-color .15s; }
  .item:hover { background: rgba(255,255,255,0.03); }
  .item.active { background: rgba(167,139,250,0.10); border-left-color: #A78BFA; }
  .thumb { width: 64px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 1px solid #23252E; background: #15171F center/cover no-repeat; }
  .meta { min-width: 0; flex: 1; }
  .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .sender { font-weight: 600; font-size: 12.5px; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .num { font-size: 11px; color: #565869; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .subject { font-size: 12.5px; color: #B4B5C4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.active .subject { color: #FFFFFF; }
  .snippet { font-size: 11.5px; color: #565869; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .tag { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; border: 1px solid; }
  .tag.info    { color: #C4B5FD; background: #1C1A30; border-color: #383159; }
  .tag.alert   { color: #FCA5A5; background: #26171F; border-color: #5D2F35; }
  .tag.success { color: #4ADE80; background: #08241F; border-color: #0B5236; }
  .tag.release { color: #F9A8D4; background: #26192B; border-color: #5A3358; }

  .viewer { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #090B14; }
  .viewer-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 22px; border-bottom: 1px solid #1C1E27; flex-shrink: 0; }
  .viewer-head h2 { font-family: 'Hahmlet', Georgia, serif; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-head .meta-line { font-size: 12px; color: #7D7F8F; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { font-size: 12.5px; font-weight: 600; color: #FFFFFF; text-decoration: none; border: 1px solid #23252E; background: #15171F; border-radius: 12px; padding: 8px 14px; white-space: nowrap; cursor: pointer; transition: border-color .15s; }
  .btn:hover { border-color: #A78BFA; }
  .btn.seg.on { background: #1C1A30; border-color: #383159; color: #C4B5FD; }
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: auto; }
  .stage iframe { width: 100%; height: 100%; border: 0; background: #090B14; transition: width .25s ease; }
  .stage.mobile iframe { width: 390px; border-left: 1px solid #1C1E27; border-right: 1px solid #1C1E27; }

  @media (max-width: 860px) {
    .sidebar { width: 96px; }
    .meta, .section { display: none; }
    .item { justify-content: center; padding: 10px 0; }
    .topbar .label, .viewer-head .meta-line, .seg { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <img src="img/brand/lockup@2x.png" alt="humAIne">
  <div class="label"><b>12</b> email templates &middot; dark, app-native</div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="section">Lifecycle &middot; 4</div>
    <div class="item" data-src="01-early-access.html" data-sender="humAIne" data-tag="info" data-label="Early access"></div>
    <div class="item" data-src="07-welcome.html" data-sender="humAIne" data-tag="success" data-label="Welcome"></div>
    <div class="item" data-src="09-onboarding-abandoned.html" data-sender="humAIne" data-tag="info" data-label="Abandoned setup"></div>
    <div class="item" data-src="12-product-update.html" data-sender="humAIne" data-tag="release" data-label="Product update"></div>

    <div class="section">Transactional &middot; 8</div>
    <div class="item" data-src="02-security-alert.html" data-sender="humAIne Security" data-tag="alert" data-label="New device"></div>
    <div class="item" data-src="03-document-shared.html" data-sender="humAIne" data-tag="info" data-label="Document shared"></div>
    <div class="item" data-src="04-password-reset.html" data-sender="humAIne Security" data-tag="info" data-label="Password reset"></div>
    <div class="item" data-src="05-pin-reset.html" data-sender="humAIne Security" data-tag="info" data-label="PIN reset"></div>
    <div class="item" data-src="06-mfa-change.html" data-sender="humAIne Security" data-tag="alert" data-label="MFA reset"></div>
    <div class="item" data-src="08-otp-code.html" data-sender="humAIne Security" data-tag="info" data-label="Sign-in code"></div>
    <div class="item" data-src="10-org-invite.html" data-sender="humAIne" data-tag="info" data-label="Org invite"></div>
    <div class="item" data-src="11-password-changed.html" data-sender="humAIne Security" data-tag="success" data-label="Password changed"></div>
  </aside>

  <main class="viewer">
    <div class="viewer-head">
      <div style="min-width:0">
        <h2 id="viewer-title">&nbsp;</h2>
        <div class="meta-line" id="viewer-pre">&nbsp;</div>
      </div>
      <div class="actions">
        <button class="btn seg on" id="btn-desktop" type="button">Desktop</button>
        <button class="btn seg" id="btn-mobile" type="button">Mobile</button>
        <a class="btn" id="viewer-file" href="#" target="_blank" rel="noopener">Open &nearr;</a>
      </div>
    </div>
    <div class="stage" id="stage"><iframe id="viewer-frame" title="Email preview"></iframe></div>
  </main>
</div>

<script>
  const items = [...document.querySelectorAll('.item')];
  const frame = document.getElementById('viewer-frame');
  const titleEl = document.getElementById('viewer-title');
  const preEl = document.getElementById('viewer-pre');
  const fileEl = document.getElementById('viewer-file');
  const stage = document.getElementById('stage');
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // Build each sidebar row from the template itself: subject from <title>, snippet from the preheader.
  items.forEach(item => {
    const src = item.dataset.src, stem = src.replace('.html', '');
    item.innerHTML =
      `<div class="thumb" style="background-image:url('img/hero/${stem}.jpg')"></div>
       <div class="meta">
         <div class="row1"><span class="sender">${esc(item.dataset.sender)}</span><span class="num">${stem.slice(0, 2)}</span></div>
         <div class="subject">${esc(item.dataset.label)}</div>
         <div class="snippet">&nbsp;</div>
         <span class="tag ${item.dataset.tag}">${esc(item.dataset.label)}</span>
       </div>`;
    fetch(src).then(r => r.text()).then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const subject = (doc.querySelector('title')?.textContent || '').trim();
      const pre = (doc.body.querySelector('div')?.textContent || '').replace(/[‌ ]+/g, ' ').trim();
      item.dataset.subject = subject; item.dataset.pre = pre;
      if (subject) item.querySelector('.subject').textContent = subject;
      if (pre) item.querySelector('.snippet').textContent = pre;
      if (item.classList.contains('active')) showMeta(item);
    }).catch(() => {});
  });

  function showMeta(item) {
    titleEl.textContent = item.dataset.subject || item.dataset.label;
    preEl.textContent = item.dataset.pre || '';
  }

  function select(item) {
    items.forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    frame.src = item.dataset.src;
    fileEl.href = item.dataset.src;
    showMeta(item);
    history.replaceState(null, '', '#' + item.dataset.src.slice(0, 2));
  }

  items.forEach(item => item.addEventListener('click', () => select(item)));

  const setMode = mobile => {
    stage.classList.toggle('mobile', mobile);
    document.getElementById('btn-mobile').classList.toggle('on', mobile);
    document.getElementById('btn-desktop').classList.toggle('on', !mobile);
  };
  document.getElementById('btn-desktop').addEventListener('click', () => setMode(false));
  document.getElementById('btn-mobile').addEventListener('click', () => setMode(true));

  const hash = location.hash.slice(1);
  select(items.find(i => hash && i.dataset.src.startsWith(hash)) || items[0]);

  document.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault();
    const idx = items.findIndex(i => i.classList.contains('active'));
    const next = items[e.key === 'ArrowDown' ? Math.min(idx + 1, items.length - 1) : Math.max(idx - 1, 0)];
    select(next);
    next.scrollIntoView({ block: 'nearest' });
  });
</script>
</body>
</html>
